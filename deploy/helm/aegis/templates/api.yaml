apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.fullname" . }}-api
  labels:
    app.kubernetes.io/name: api
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: aegis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: aegis }
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "aegis.image" (dict "root" . "repo" .Values.api.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: {{ .Values.api.port }} }]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: API_PORT
              value: {{ .Values.api.port | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.config.corsOrigins | quote }}
            - name: DASHBOARD_URL
              value: {{ .Values.config.dashboardURL | quote }}
            - name: SCANNER_BASE_URL
              value: "http://{{ include "aegis.fullname" . }}-scanner:{{ .Values.scanner.port }}"
            - name: RATE_LIMIT_RPM
              value: {{ .Values.config.rateLimitRPM | quote }}
            - name: AUTH_RATE_LIMIT_RPM
              value: {{ .Values.config.authRateLimitRPM | quote }}
            - name: EMAIL_PROVIDER
              value: {{ .Values.config.emailProvider | quote }}
            - name: AI_PROVIDER
              value: {{ .Values.config.aiProvider | quote }}
            {{- include "aegis.commonEnv" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.api.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.api.port }} }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis.fullname" . }}-api
  labels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: aegis }
spec:
  selector: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: aegis }
  ports: [{ port: {{ .Values.api.port }}, targetPort: {{ .Values.api.port }} }]
