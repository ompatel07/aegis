apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.fullname" . }}-orchestrator
  labels:
    app.kubernetes.io/name: orchestrator
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  {{- if not .Values.orchestrator.autoscaling.enabled }}
  replicas: {{ .Values.orchestrator.replicas }}
  {{- end }}
  selector:
    matchLabels: { app.kubernetes.io/name: orchestrator, app.kubernetes.io/part-of: aegis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: orchestrator, app.kubernetes.io/part-of: aegis }
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: orchestrator
          image: {{ include "aegis.image" (dict "root" . "repo" .Values.orchestrator.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
            readOnlyRootFilesystem: false   # clones repos into the workspace
          env:
            - name: SCANNER_BASE_URL
              value: "http://{{ include "aegis.fullname" . }}-scanner:{{ .Values.scanner.port }}"
            - name: WORKSPACE_DIR
              value: /workspaces
            {{- include "aegis.commonEnv" . | nindent 12 }}
          volumeMounts:
            - { name: workspace, mountPath: /workspaces }
          resources: {{- toYaml .Values.orchestrator.resources | nindent 12 }}
      volumes:
        - name: workspace
          emptyDir: { sizeLimit: 10Gi }
