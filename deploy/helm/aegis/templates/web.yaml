apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.fullname" . }}-web
  labels:
    app.kubernetes.io/name: web
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: aegis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: aegis }
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "aegis.image" (dict "root" . "repo" .Values.web.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: {{ .Values.web.port }} }]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - { name: NODE_ENV, value: production }
            - name: API_INTERNAL_URL
              value: "http://{{ include "aegis.fullname" . }}-api:{{ .Values.api.port }}/api/v1"
            - name: NEXT_PUBLIC_API_URL
              value: "{{ .Values.config.dashboardURL }}/api/v1"
            - name: NEXTAUTH_URL
              value: {{ .Values.config.dashboardURL | quote }}
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef: { name: {{ include "aegis.secretName" . }}, key: JWT_ACCESS_SECRET }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis.fullname" . }}-web
  labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: aegis }
spec:
  selector: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: aegis }
  ports: [{ port: {{ .Values.web.port }}, targetPort: {{ .Values.web.port }} }]
