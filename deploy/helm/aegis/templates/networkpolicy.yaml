{{- if .Values.networkPolicy.enabled }}
{{- $part := dict "app.kubernetes.io/part-of" "aegis" }}
# Default-deny all ingress in the namespace; policies below re-open only what's needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis.fullname" . }}-default-deny
  labels: {{- include "aegis.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# API: reachable from the ingress controller (any pod on the tier); it fronts /api/v1.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis.fullname" . }}-api
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: api, app.kubernetes.io/part-of: aegis }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: {{ .Values.api.port }} }]
---
# Scanner: only the orchestrator (and API for rule validation) may call it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis.fullname" . }}-scanner
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: scanner, app.kubernetes.io/part-of: aegis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: orchestrator } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: api } }
      ports: [{ port: {{ .Values.scanner.port }} }]
---
# Postgres + Redis: only API + orchestrator + migrate may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis.fullname" . }}-datastores
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [postgres, redis] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: api } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: orchestrator } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: migrate } }
---
# Web: reachable from ingress; talks only to the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis.fullname" . }}-web
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: aegis }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: {{ .Values.web.port }} }]
{{- end }}
