{{- if .Values.secrets.create }}
# Dev/self-contained only. For production use externalSecrets.enabled or supply
# an existing Secret via secrets.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegis.fullname" . }}-secrets
  labels: {{- include "aegis.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- if .Values.externalSecrets.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "aegis.secretName" . }}
  labels: {{- include "aegis.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.externalSecrets.existingSecret | default .Values.secrets.existingSecret }}
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^{{ .Values.externalSecrets.remoteKeyPrefix }}"
{{- end }}
