apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.fullname" . }}-scanner
  labels:
    app.kubernetes.io/name: scanner
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  {{- if not .Values.scanner.autoscaling.enabled }}
  replicas: {{ .Values.scanner.replicas }}
  {{- end }}
  selector:
    matchLabels: { app.kubernetes.io/name: scanner, app.kubernetes.io/part-of: aegis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: scanner, app.kubernetes.io/part-of: aegis }
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scanner
          image: {{ include "aegis.image" (dict "root" . "repo" .Values.scanner.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: {{ .Values.scanner.port }} }]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
            readOnlyRootFilesystem: false   # engines write temp files
          env:
            - { name: SCANNER_HOST, value: "0.0.0.0" }
            - { name: SCANNER_PORT, value: {{ .Values.scanner.port | quote }} }
            - { name: LOG_LEVEL, value: {{ .Values.config.logLevel | quote }} }
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.scanner.port }} }
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - { name: workspace, mountPath: /workspaces }
            - { name: tmp, mountPath: /tmp }
          resources: {{- toYaml .Values.scanner.resources | nindent 12 }}
      volumes:
        - name: workspace
          emptyDir: { sizeLimit: 10Gi }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis.fullname" . }}-scanner
  labels: { app.kubernetes.io/name: scanner, app.kubernetes.io/part-of: aegis }
spec:
  selector: { app.kubernetes.io/name: scanner, app.kubernetes.io/part-of: aegis }
  ports: [{ port: {{ .Values.scanner.port }}, targetPort: {{ .Values.scanner.port }} }]
