{{- if .Values.migrate.enabled }}
# DB migrations run as a pre-install/pre-upgrade hook so schema is ready before
# the app rolls out. Uses the API image (ships the migrate binary + SQL).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aegis.fullname" . }}-migrate
  labels:
    app.kubernetes.io/name: migrate
    {{- include "aegis.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: { app.kubernetes.io/name: migrate, app.kubernetes.io/part-of: aegis }
    spec:
      restartPolicy: Never
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "aegis.image" (dict "root" . "repo" .Values.api.image) }}
          command: ["/usr/local/bin/migrate"]
          args: ["-path", "/migrations", "-database", "$(DATABASE_URL)", "up"]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "aegis.commonEnv" . | nindent 12 }}
{{- end }}
