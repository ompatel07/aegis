# Aegis Helm values. Production overrides go in a separate values file.

global:
  imageRegistry: ""          # e.g. ghcr.io/acme ; empty → images as-is
  imagePullSecrets: []
  storageClass: ""

image:
  tag: "2.0"
  pullPolicy: IfNotPresent

# ── Application services ──────────────────────────────────────────────────────
api:
  image: aegis/api
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: "1",  memory: 512Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

orchestrator:
  image: aegis/orchestrator
  replicas: 2
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits:   { cpu: "2",  memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 12
    targetCPUUtilizationPercentage: 75

scanner:
  image: aegis/scanner
  replicas: 3
  port: 8000
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits:   { cpu: "4",  memory: 4Gi }     # scanning is CPU/mem heavy
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

web:
  image: aegis/web
  replicas: 2
  port: 3000
  resources:
    requests: { cpu: 50m,  memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

migrate:
  enabled: true            # run the DB migration Job as a pre-install/upgrade hook

# ── Config (non-secret) ───────────────────────────────────────────────────────
config:
  environment: production
  logLevel: info
  corsOrigins: "https://aegis.example.com"
  dashboardURL: "https://aegis.example.com"
  emailProvider: log
  aiProvider: mock
  rateLimitRPM: "120"
  authRateLimitRPM: "10"

# ── Secrets ───────────────────────────────────────────────────────────────────
# Provide via one of:
#   secrets.create=true            → chart renders a Secret from secrets.values (dev only)
#   externalSecrets.enabled=true   → External Secrets Operator pulls from a store
#   (default) supply an existing Secret name in secrets.existingSecret
secrets:
  create: false
  existingSecret: aegis-secrets
  values:
    JWT_ACCESS_SECRET: ""
    JWT_REFRESH_SECRET: ""
    TOKEN_ENCRYPTION_KEY: ""
    POSTGRES_PASSWORD: ""

externalSecrets:
  enabled: false
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  remoteKeyPrefix: "aegis/"

# ── Datastores (in-chart for self-contained deploys; use managed DB in prod) ──
postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 20Gi
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: "2",  memory: 2Gi }
redis:
  enabled: true
  image: redis:7-alpine
  storage: 5Gi

# ── Ingress (provider: nginx | traefik | alb | gce) ───────────────────────────
ingress:
  enabled: true
  provider: nginx
  host: aegis.example.com
  tls:
    enabled: true
    secretName: aegis-tls
  annotations: {}          # extra provider-specific annotations merged in

# ── Network policy (default-deny + explicit allows) ───────────────────────────
networkPolicy:
  enabled: true

# ── Observability (Prometheus Operator) ───────────────────────────────────────
observability:
  serviceMonitor:
    enabled: false          # needs prometheus-operator CRDs
    interval: 30s
  prometheusRule:
    enabled: false

# ── Pod security (defaults applied to every workload) ─────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }
