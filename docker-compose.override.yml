# ─────────────────────────────────────────────────────────────────────────────
# Development overrides (auto-loaded by `make dev` / plain `docker compose up`).
#   * exposes service ports on the host for direct access/debugging
#   * pretty (human) logs + development environment
#   * scanner hot-reload via a source bind mount
#
# Go (api/orchestrator) and the Next.js build are prod-style images here; for
# rapid Go/web iteration run those services locally — see DEVELOPMENT.md.
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  scanner:
    ports:
      - "${SCANNER_PORT:-8000}:8000"
    environment:
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
    # Bind-mount source for hot reload (deps stay in the image's site-packages).
    volumes:
      - ./services/scanner:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  api:
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      LOG_PRETTY: "true"
      ENVIRONMENT: development

  orchestrator:
    environment:
      LOG_PRETTY: "true"
      ENVIRONMENT: development

  web:
    ports:
      - "${WEB_PORT:-3000}:3000"
