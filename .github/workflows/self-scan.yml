name: aegis-self-scan

# Task 3a — "Aegis scans Aegis on every commit". We dogfood the exact tools the
# scanner runs (Semgrep with our own taint rules, Gitleaks, Trivy, govulncheck,
# npm audit, pip-audit) and gate the build on critical/high findings so the
# platform's own repo can never regress below its grade-A bar.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-vuln:
    name: Go vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        # N2: .10 fixes GO-2026-6809 (crypto/x509) which govulncheck reports against
        # the toolchain itself, not a dependency. Pinned to the patch, not "1.26".
        with: { go-version: "1.26.10" }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: api
        working-directory: services/api
        run: govulncheck ./...
      - name: orchestrator
        working-directory: services/orchestrator
        run: govulncheck ./...

  npm-audit:
    name: Web dependencies (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      # N2: a per-advisory gate, not a severity threshold. `--audit-level=high` is
      # all-or-nothing: either the job is red on something nobody can act on, or
      # someone raises the threshold and every future advisory is absorbed silently.
      # Both happened here. Every tolerated advisory is now named with its reason in
      # scripts/check_dependency_audits.py, and anything new fails.
      - name: install web deps
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: audit (per-advisory gate)
        run: python scripts/check_dependency_audits.py --npm

  pip-audit:
    name: Scanner dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      # Same per-advisory gate as npm (see the web job).
      - run: python scripts/check_dependency_audits.py --pip

  no-silent-degradation:
    name: Structural guard (no silent degradation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # B1 (Pass D1): fail the build on swallowed exceptions and measurement
      # functions that fabricate a constant on an error path, unless documented
      # with `# fail-open:`. Keeps the whole class from creeping back in.
      - run: python services/scanner/tools/check_no_silent_degradation.py
      # J2: the compliance mappings must exist in exactly one place, and every
      # evidence identifier must be one an engine can actually emit. Both
      # defects had been fixed once and returned.
      - run: pip install --quiet pyyaml
      - run: python services/scanner/tools/check_single_framework_tree.py
      # K1: every table read with SELECT * must have a Go struct covering all
      # its columns. This class shipped twice as a P0 (T2 excluded_bundled,
      # J4 code_key) and is invisible to go build, go vet and the unit suite.
      - run: python services/scanner/tools/check_select_star_columns.py
      # N1: no rule with a non-permitted licence may ship (per-rule licence,
      # manifest integrity, logic fingerprints of every removed Semgrep-licensed
      # rule), and no code path may fetch rules from the Semgrep registry.
      - run: python services/scanner/tools/check_rule_licences.py

  semgrep:
    name: SAST (Semgrep + Aegis taint rules)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # Exactly the rule set Aegis ships, nothing fetched. N1 removed
      # `--config p/security-audit`, a live Semgrep-registry fetch of Semgrep-
      # licensed rules: the self-scan dogfoods the product's own rules.
      # --error makes any finding fail the job (our bar is zero).
      # The rule directories are named, not services/scanner/rules: that directory
      # also holds manifest.yaml, which is not a rule file, and passing it made this
      # job fail with "invalid configuration file" on every push since G2.
      - run: |
          semgrep scan --error --severity ERROR --metrics off \
            --config services/scanner/rules/taint \
            --config services/scanner/rules/quality \
            --config services/scanner/rules/iac \
            --config services/scanner/rules/cicd \
            --config services/scanner/rules/vendor \
            --exclude services/scanner/rules \
            --exclude services/scanner/rules_staging \
            --exclude services/scanner/tests/fixtures \
            --exclude "**/.venv/**" --exclude "**/node_modules/**"

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  trivy:
    name: Filesystem + config (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # N2: pinned to v0.36.0. v0.28.0 depended on `setup-trivy@v0.2.1`, which GitHub
      # can no longer resolve ("unable to find version"), so this job had NEVER run --
      # it failed at action-resolution on every push. v0.36.0 pins setup-trivy@v0.2.6.
      # Both pinned by SHA so the dependency cannot move under us again.
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          # tests/fixtures/vulnerable_app pins flask 0.12.0 / pyyaml 5.1 / requests
          # 2.19.0 ON PURPOSE, so the SCA engine has known CVEs to detect. Scanning
          # our own test corpus would report our fixtures as our dependencies.
          skip-dirs: "**/.venv,**/node_modules,services/scanner/tests/fixtures"
          # Accepted findings are named per check AND per path, with a written
          # statement, in .trivyignore.yaml -- never a bare id that would suppress
          # the check everywhere including in code we own.
          trivyignores: ".trivyignore.yaml"
