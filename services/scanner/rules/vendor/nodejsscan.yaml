rules:
- id: ajinabraham.njsscan.crypto.crypto_node.node_aes_ecb
  patterns:
  - pattern-either:
    - pattern: '$X.createCipheriv("=~/^aes-([0-9]+)-ecb$/i", ...)

        '
    - pattern: '$X.createDecipheriv("=~/^aes-([0-9]+)-ecb$/i", ...)

        '
  message: AES with ECB mode is deterministic in nature and not suitable for encrypting
    large amount of repetitive data.
  languages:
  - javascript
  severity: ERROR
  metadata:
    owasp-web: a9
    cwe: cwe-327
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/crypto/crypto_node.yaml
- id: ajinabraham.njsscan.crypto.crypto_node.node_aes_noiv
  patterns:
  - pattern-either:
    - pattern: '$X.createCipheriv("=~/^aes-/i", $KEY, "", ...)

        '
  message: AES algorithms requires an initialization vector (IV). Providing no or
    null IV in some implementation results to a 0 IV. Use of a deterministic IV makes
    dictionary attacks easier.
  languages:
  - javascript
  severity: WARNING
  metadata:
    owasp-web: a9
    cwe: cwe-327
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/crypto/crypto_node.yaml
- id: ajinabraham.njsscan.crypto.crypto_node.node_md5
  patterns:
  - pattern: '$X.createHash("md5")

      '
  message: MD5 is a a weak hash which is known to have collision. Use a strong hashing
    function.
  languages:
  - javascript
  severity: WARNING
  metadata:
    owasp-web: a9
    cwe: cwe-327
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/crypto/crypto_node.yaml
- id: ajinabraham.njsscan.crypto.crypto_node.node_sha1
  patterns:
  - pattern: '$X.createHash("sha1")

      '
  message: SHA1 is a a weak hash which is known to have collision. Use a strong hashing
    function.
  languages:
  - javascript
  severity: WARNING
  metadata:
    owasp-web: a9
    cwe: cwe-327
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/crypto/crypto_node.yaml
- id: ajinabraham.njsscan.crypto.crypto_node.node_weak_crypto
  patterns:
  - pattern-either:
    - pattern: '$X.createCipher(''des'', ...)

        '
  message: A weak or broken cryptographic algorithm was identified. Using these functions
    will introduce vulnerabilities or downgrade the security of your application.
  languages:
  - javascript
  severity: ERROR
  metadata:
    owasp-web: a9
    cwe: cwe-327
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/crypto/crypto_node.yaml
- id: ajinabraham.njsscan.crypto.tls_node.node_curl_ssl_verify_disable
  patterns:
  - pattern: '$X(..., {SSL_VERIFYPEER : 0}, ...)

      '
  message: SSL Certificate verification for node-curl is disabled.
  languages:
  - javascript
  severity: ERROR
  metadata:
    owasp-web: a6
    cwe: cwe-599
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/crypto/tls_node.yaml
- id: ajinabraham.njsscan.crypto.tls_node.node_tls_reject
  patterns:
  - pattern-either:
    - pattern: '$X.env.NODE_TLS_REJECT_UNAUTHORIZED = ''0''

        '
    - pattern: '$X.env[''NODE_TLS_REJECT_UNAUTHORIZED'']= ''0''

        '
  message: Setting 'NODE_TLS_REJECT_UNAUTHORIZED' to 0 will allow node server to accept
    self signed certificates and is not a secure behaviour.
  languages:
  - javascript
  severity: ERROR
  metadata:
    owasp-web: a6
    cwe: cwe-295
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/crypto/tls_node.yaml
- id: ajinabraham.njsscan.database.nosql_find_injection.node_nosqli_injection
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $REQ.$PROP
      - pattern: $REQ.$PROP.$FIELD
      - pattern: $REQ.$PROP[$KEY]
    - metavariable-regex:
        metavariable: $REQ
        regex: (?i)^(req|request)$
    - metavariable-regex:
        metavariable: $PROP
        regex: ^(body|query|params|headers|cookies)$
  pattern-sanitizers:
  - patterns:
    - pattern: $SANITIZE(...)
    - pattern-either:
      - pattern-inside: '$SANITIZE = require(''mongo-sanitize'')

          ...

          '
      - pattern-inside: 'import $SANITIZE from ''mongo-sanitize''

          ...

          '
      - pattern-inside: 'import * as $SANITIZE from ''mongo-sanitize''

          ...

          '
      - pattern-inside: 'import {..., $SANITIZE, ...} from ''mongo-sanitize''

          ...

          '
  pattern-sinks:
  - patterns:
    - pattern: $OBJ.findOne($QUERY, ...)
    - pattern-not: '$OBJ.findOne({..., where: $W, ...}, ...)'
  pattern-not-sinks:
  - patterns:
    - pattern: $OBJ.findOne($QUERY, ...)
    - pattern-either:
      - pattern-inside: '$SEQUELIZE = require(''sequelize'')

          ...

          $SEQUELIZE(...)

          ...

          '
      - pattern-inside: 'import $SEQUELIZE from ''sequelize''

          ...

          $SEQUELIZE(...)

          ...

          '
  message: Untrusted user input in findOne() function can result in NoSQL Injection.
  languages:
  - javascript
  severity: ERROR
  metadata:
    owasp-web: a1
    cwe: cwe-943
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/database/nosql_find_injection.yaml
    aegis-modified: '2026-10-22 Aegis Pass N2b: findOne({where: ...}) (Sequelize/TypeORM)
      is not a sink; upstream''s pattern-not-sinks is not a semgrep key and never
      applied'
- id: ajinabraham.njsscan.database.nosql_injection.node_nosqli_js_injection
  patterns:
  - pattern-either:
    - pattern: '$OBJ.$FUNC({$where: <... $REQ.$FOO.$BAR ...>}, ...)

        '
    - pattern: '$OBJ.$FUNC({$where: <... $REQ.$QUERY ...>}, ...)

        '
    - pattern: '$NSQL = <... $REQ.$QUERY.$...>;

        ...

        $OBJ.$FUNC({$where: <... $NSQL ...>}, ...)

        '
    - pattern: '$NSQL = <... $REQ.$QUERY ...>;

        ...

        $OBJ.$FUNC({$where: <... $NSQL ...>}, ...)

        '
    - pattern: '$INP = $REQ.$FOO.$BAR;

        ...

        $QRY = {$where: <... $INP ...>};

        ...

        $OBJ.$FUNC(<... $QRY ...>, ...)

        '
    - pattern: '$INP = $REQ.$FOO;

        ...

        $QRY = {$where: <... $INP ...>};

        ...

        $OBJ.$FUNC(<... $QRY ...>, ...)

        '
    - pattern: '$QRY["$where"] = <... $REQ.$FOO ...>;

        ...

        $OBJ.$FUNC(<... $QRY ...>, ...)

        '
    - pattern: '$QRY["$where"] = <... $REQ.$FOO.$BAR ...>;

        ...

        $OBJ.$FUNC(<... $QRY ...>, ...)

        '
    - pattern: '$INP = $REQ.$FOO;

        ...

        $QRY["$where"] = <... $INP ...>;

        ...

        $OBJ.$FUNC(<... $QRY ...>, ...)

        '
    - pattern: '$INP = $REQ.$FOO.$BAR;

        ...

        $QRY["$where"] = <... $INP ...>;

        ...

        $OBJ.$FUNC(<... $QRY ...>, ...)

        '
  message: Untrusted user input in MongoDB $where operator can result in NoSQL JavaScript
    Injection.
  languages:
  - javascript
  severity: ERROR
  metadata:
    owasp-web: a1
    cwe: cwe-943
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/database/nosql_injection.yaml
- id: ajinabraham.njsscan.database.sequelize_tls.sequelize_tls
  message: 'The Sequelize connection string indicates that database server does not
    use TLS. Non TLS connections are susceptible to man in the middle (MITM) attacks.

    '
  languages:
  - javascript
  severity: WARNING
  metadata:
    owasp-web: a6
    cwe: cwe-319
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/database/sequelize_tls.yaml
  patterns:
  - pattern: "{\n  host: $HOST,\n  database: $DATABASE,\n  dialect: $DIALECT\n }\n"
  - pattern-not: "{\n  host: $HOST,\n  database: $DATABASE,\n  dialect: \"postgres\"\
      ,\n  dialectOptions: {\n      ssl: true\n  }\n}\n"
  - pattern-not: "{\n  host: $HOST,\n  database: $DATABASE,\n  dialect: $DIALECT,\n\
      \  dialectOptions: {\n    ssl: { ... }\n  }\n}\n"
  - metavariable-regex:
      metavariable: $DIALECT
      regex: '[''"](mariadb|mysql|postgres|oracle)[''"]'
- id: ajinabraham.njsscan.database.sequelize_tls_validation.sequelize_tls_cert_validation
  message: 'The Sequelize connection string indicates that TLS certificate vailidation
    of database server is disabled. This is equivalent to not having TLS. An attacker
    can present any invalid certificate and Sequelize will make database connection
    ignoring certificate errors. This setting make the connection susceptible to man
    in the middle (MITM) attacks. Not applicable to SQLite database.

    '
  severity: ERROR
  languages:
  - javascript
  metadata:
    owasp-web: a6
    cwe: cwe-295
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/database/sequelize_tls_validation.yaml
  patterns:
  - pattern: "{\n  host: $HOST,\n  database: $DATABASE,\n  dialect: $DIALECT,\n  dialectOptions:\
      \ {\n    ssl: {\n      rejectUnauthorized: false\n    }\n  }\n }\n"
  - metavariable-regex:
      metavariable: $DIALECT
      regex: '[''"](mariadb|mysql|postgres)[''"]'
- id: ajinabraham.njsscan.database.sequelize_weak_tls.sequelize_weak_tls
  message: 'The Sequelize connection string indicates that an older version of TLS
    is in use. TLS1.0 and TLS1.1 are deprecated and should be used. By default, Sequelize
    use TLSv1.2 but it''s recommended to use TLS1.3. Not applicable to SQLite database.

    '
  metadata:
    owasp-web: a6
    cwe: cwe-757
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/database/sequelize_weak_tls.yaml
  severity: ERROR
  languages:
  - javascript
  patterns:
  - pattern-inside: "{\n  host: $HOST,\n  database: $DATABASE,\n  dialect: $DIALECT,\n\
      \  dialectOptions:\n    { ssl: ... }\n }\n"
  - pattern-either:
    - pattern: "{\n  minVersion: 'TLSv1'\n}\n"
    - pattern: "{\n  minVersion: 'TLSv1.1'\n}\n"
  - metavariable-regex:
      metavariable: $DIALECT
      regex: '[''"](mariadb|mysql|postgres)[''"]'
- id: ajinabraham.njsscan.database.sql_injection.node_sqli_injection
  patterns:
  - pattern-either:
    - pattern-inside: 'require(''sql-client'')

        ...

        '
    - pattern-inside: 'require(''mysql'')

        ...

        '
    - pattern-inside: 'require(''pg'')

        ...

        '
    - pattern-inside: 'require(''mssql'')

        ...

        '
    - pattern-inside: 'require(''oracledb'')

        ...

        '
  - pattern-either:
    - pattern: '$CON.query(<... $REQ.$QUERY.$VAR ...>, ...)

        '
    - pattern: '$CON.query(<... $REQ.$QUERY ...>, ...)

        '
    - pattern: '$SQL = <... $REQ.$QUERY.$VAR ...>;

        ...

        $CON.query(<... $SQL ...>, ...)

        '
    - pattern: '$SQL = <... $REQ.$QUERY ...>;

        ...

        $CON.query(<... $SQL ...>, ...)

        '
    - pattern: '$INP = <... $REQ.$QUERY.$VAR ...>;

        ...

        $SQL = <... $INP ...>;

        ...

        $CON.query(<... $SQL ...>, ...)

        '
    - pattern: '$INP = <... $REQ.$QUERY ...>;

        ...

        $SQL = <... $INP ...>;

        ...

        $CON.query(<... $SQL ...>, ...)

        '
