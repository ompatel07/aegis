  - javascript
  severity: ERROR
  metadata:
    owasp-web: a1
    cwe: cwe-89
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/database/sql_injection.yaml
- id: ajinabraham.njsscan.database.sql_injection_knex.node_knex_sqli_injection
  patterns:
  - pattern-either:
    - pattern-inside: '$KNEX = require(''knex'')

        ...

        '
    - pattern-inside: '$KNEX = require(''knex'')(...)

        ...

        '
  - pattern-either:
    - pattern: '$K.raw(<... $REQ.$QUERY.$VAR ...>, ...)

        '
    - pattern: '$K.raw(<... $REQ.$QUERY ...>, ...)

        '
    - pattern: '$SQL = <... $REQ.$QUERY.$VAR ...>;

        ...

        $K.raw(<... $SQL ...>, ...)

        '
    - pattern: '$SQL = <... $REQ.$QUERY ...>;

        ...

        $K.raw(<... $SQL ...>, ...)

        '
    - pattern: '$INP = <... $REQ.$QUERY.$VAR ...>;

        ...

        $SQL = <... $INP ...>;

        ...

        $K.raw(<... $SQL ...>, ...)

        '
    - pattern: '$INP = <... $REQ.$QUERY ...>;

        ...

        $SQL = <... $INP ...>;

        ...

        $K.raw(<... $SQL ...>, ...)

        '
    - pattern: '$K.whereRaw(<... $REQ.$QUERY.$VAR ...>, ...)

        '
    - pattern: '$K.whereRaw(<... $REQ.$QUERY ...>, ...)

        '
    - pattern: '$SQL = <... $REQ.$QUERY.$VAR ...>;

        ...

        $K.whereRaw(<... $SQL ...>, ...)

        '
    - pattern: '$SQL = <... $REQ.$QUERY ...>;

        ...

        $K.whereRaw(<... $SQL ...>, ...)

        '
    - pattern: '$INP = <... $REQ.$QUERY.$VAR ...>;

        ...

        $SQL = <... $INP ...>;

        ...

        $K.whereRaw(<... $SQL ...>, ...)

        '
    - pattern: '$INP = <... $REQ.$QUERY ...>;

        ...

        $SQL = <... $INP ...>;

        ...

        $K.whereRaw(<... $SQL ...>, ...)

        '
  message: Untrusted input concatinated with raw SQL query using knex raw()  or whereRaw()
    functions can result in SQL Injection.
  languages:
  - javascript
  severity: ERROR
  metadata:
    owasp-web: a1
    cwe: cwe-89
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/database/sql_injection_knex.yaml
- id: ajinabraham.njsscan.dos.express_bodyparser_dos.express_bodyparser
  patterns:
  - pattern-inside: '$APP = express()

      ...

      '
  - pattern-inside: '$APP.use(...)

      '
  - pattern: $X.bodyParser(...)
  message: POST Request to Express Body Parser 'bodyParser()' can create Temporary
    files and consume space.
  languages:
  - javascript
  severity: ERROR
  metadata:
    owasp-web: a9
    cwe: cwe-400
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/dos/express_bodyparser_dos.yaml
- id: ajinabraham.njsscan.dos.layer7_object_dos.layer7_object_dos
  patterns:
  - pattern-either:
    - pattern-inside: function ($REQ, $RES, ...) {...}
    - pattern-inside: function $FUNC($REQ, $RES, ...) {...}
    - pattern-inside: $X = function $FUNC($REQ, $RES, ...) {...}
    - pattern-inside: var $X = function $FUNC($REQ, $RES, ...) {...};
    - pattern-inside: $APP.$METHOD(..., function $FUNC($REQ, $RES, ...) {...})
  - pattern-either:
    - pattern-inside: '$OBJ = $REQ.body;

        ...

        '
    - pattern-inside: '$OBJ = $REQ.body.$FOO;

        ...

        '
  - pattern-inside: 'for(...){...}

      '
  - pattern: '$OBJ.length

      '
  message: Layer7 Denial of Service. Looping over user controlled objects can result
    in DoS.
  languages:
  - javascript
  severity: ERROR
  metadata:
    owasp-web: a6
    cwe: cwe-400
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/dos/layer7_object_dos.yaml
- id: ajinabraham.njsscan.dos.regex_injection.regex_injection_dos
  patterns:
  - pattern-either:
    - pattern-inside: function ($REQ, $RES, ...) {...}
    - pattern-inside: function $FUNC($REQ, $RES, ...) {...}
    - pattern-inside: $X = function $FUNC($REQ, $RES, ...) {...}
    - pattern-inside: var $X = function $FUNC($REQ, $RES, ...) {...};
    - pattern-inside: $APP.$METHOD(..., function $FUNC($REQ, $RES, ...) {...})
  - pattern-either:
    - pattern: '$INP = <... $REQ.$PARAM ...>;

        ...

        $RE = new RegExp(<... $INP ...>)

        '
    - pattern: '$INP = <... $REQ.$PARAM.$BAR ...>;

        ...

        $RE = new RegExp(<... $INP ...>)

        '
    - pattern: 'new RegExp(<... $REQ.$PARAM ...>)

        '
    - pattern: 'new RegExp(<... $REQ.$PARAM.$BAR ...>)

        '
    - pattern: '$INP = <... $REQ.$PARAM ...>;

        ...

        $RE = $STR.search(<... $INP ...>)

        '
    - pattern: '$INP = <... $REQ.$PARAM.$FOO ...>;

        ...

        $RE = $STR.search(<... $INP ...>)

        '
    - pattern: '$STR.search(<... $REQ.$PARAM ...>)

        '
    - pattern: '$STR.search(<... $REQ.$PARAM.$BAR ...>)

        '
    - pattern: '$INP = <... $REQ.$PARAM ...>;

        ...

        $RE = $STR.match(<... $INP ...>)

        '
    - pattern: '$INP = <... $REQ.$PARAM.$FOO ...>;

        ...

        $RE = $STR.match(<... $INP ...>)

        '
    - pattern: '$STR.match(<... $REQ.$PARAM ...>)

        '
    - pattern: '$STR.match(<... $REQ.$PARAM.$BAR ...>)

        '
    - pattern: '$INP = <... $REQ.$PARAM ...>;

        ...

        $RE = $STR.split(<... $INP ...>)

        '
    - pattern: '$INP = <... $REQ.$PARAM.$FOO ...>;

        ...

        $RE = $STR.split(<... $INP ...>)

        '
    - pattern: '$STR.split(<... $REQ.$PARAM ...>)

        '
    - pattern: '$STR.split(<... $REQ.$PARAM.$BAR ...>)

        '
  - &id001
    metavariable-regex:
      metavariable: $REQ
      regex: (?i)^(req|request)$
  message: User controlled data in RegExp() can make the application vulnerable to
    layer 7 DoS. If user input is used to create a regular expression without validation,
    it can be exploited to create a complex regular expression that takes an excessive
    amount of time to evaluate. This can lead to a Denial of Service (DoS) attack
    where the application becomes unresponsive. Even if a ReDoS attack is not intended,
    poorly crafted or complex regular expressions from user input can cause performance
    issues that impact the responsiveness of an application. Always sanitize and validate
    user input to ensure that only safe, expected characters are used in the pattern.
    This can be done by whitelisting known safe characters and escaping potentially
    harmful ones.
  languages:
  - javascript
  severity: ERROR
  metadata:
    owasp-web: a1
    cwe: cwe-400
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/dos/regex_injection.yaml
    aegis-modified: '2026-10-22 Aegis Pass N2b: $REQ must be named req/request (was:
      any 2-parameter function)'
- id: ajinabraham.njsscan.electronjs.security_electron.electron_allow_http
  patterns:
  - pattern-either:
    - pattern: 'new BrowserWindow({webPreferences: {allowRunningInsecureContent: true}})

        '
    - pattern: 'var $X = {webPreferences: {allowRunningInsecureContent: true}};

        '
  message: Application can load content over HTTP and that makes the app vulnerable
    to Man in the middle attacks.
  languages:
  - javascript
  severity: ERROR
  metadata:
    owasp-web: a6
    cwe: cwe-319
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/electronjs/security_electron.yaml
- id: ajinabraham.njsscan.electronjs.security_electron.electron_blink_integration
  patterns:
  - pattern-either:
    - pattern: 'new BrowserWindow({webPreferences: {enableBlinkFeatures: ''...''}})

        '
    - pattern: 'var $X = {webPreferences: {enableBlinkFeatures: ''...''}};

        '
  message: Blink's expirimental features are enabled in this application. Some of
    the features may affect the security of the application.
  languages:
  - javascript
  severity: WARNING
  metadata:
    owasp-web: a6
    cwe: cwe-272
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/electronjs/security_electron.yaml
- id: ajinabraham.njsscan.electronjs.security_electron.electron_context_isolation
  patterns:
  - pattern-either:
    - pattern: 'new BrowserWindow({webPreferences: {contextIsolation: false}})

        '
    - pattern: 'var $X = {webPreferences: {contextIsolation: false}};

        '
  message: Disabling context isolation can introduce Prototype Pollution vulnerabilities.
  languages:
  - javascript
  severity: WARNING
  metadata:
    owasp-web: a6
    cwe: cwe-693
    license: LGPL-3.0-or-later
    source: https://github.com/ajinabraham/njsscan/blob/b6ade853818a0c2a4fde36a1c5740b663e758ad2/njsscan/rules/semantic_grep/electronjs/security_electron.yaml
- id: ajinabraham.njsscan.electronjs.security_electron.electron_disable_websecurity
  patterns:
  - pattern-either:
    - pattern: 'new BrowserWindow({webPreferences: {webSecurity: false}})

        '
    - pattern: 'var $X = {webPreferences: {webSecurity: false}};

