# AI-generated-code failure-mode rules — Python (Phase 2C TASK 3b).
#
# These target mistakes LLM code assistants make disproportionately often. Each
# rule has a positive + negative fixture in python.py (semgrep --test). They fire
# on any code (not only AI-detected files); the scan's AI-code report highlights
# the subset that land in AI-generated files.
rules:
  - id: ai-code-weak-crypto
    languages: [python]
    severity: ERROR
    message: >-
      Weak/deprecated cryptographic hash (MD5 or SHA-1) used. AI assistants often
      default to algorithms from older training data. Use SHA-256+ for integrity,
      or a password hash (bcrypt/argon2/scrypt) for secrets.
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021 - Cryptographic Failures"
      category: ai-code
      ai_failure_mode: deprecated-crypto
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.new("md5", ...)
          - pattern: hashlib.new("sha1", ...)

  - id: ai-code-insecure-random
    languages: [python]
    severity: WARNING
    message: >-
      Non-cryptographic RNG (random module) used to generate a security value.
      AI often reaches for random.* instead of the secrets module. Use
      secrets.token_hex() / secrets.token_urlsafe() for tokens and keys.
    metadata:
      cwe: "CWE-330"
      owasp: "A02:2021 - Cryptographic Failures"
      category: ai-code
      ai_failure_mode: insecure-random
    patterns:
      - pattern: $X = random.$F(...)
      - metavariable-regex:
          metavariable: $X
          regex: (?i).*(token|secret|key|password|passwd|nonce|salt|otp|session).*

  - id: ai-code-broad-except-pass
    languages: [python]
    severity: WARNING
    message: >-
      Broad exception caught and silently swallowed. AI defensive-coding habit
      that hides real failures. Catch specific exceptions and handle or re-raise.
    metadata:
      cwe: "CWE-396"
      category: ai-code
      ai_failure_mode: broad-exception
    patterns:
      - pattern-either:
          - pattern: |
              try:
                  ...
              except Exception:
                  pass
          - pattern: |
              try:
                  ...
              except:
                  pass

  - id: ai-code-jwt-no-verify
    languages: [python]
    severity: ERROR
    message: >-
      JWT decoded without verifying its signature. AI frequently omits signature
      verification, letting attackers forge tokens. Verify the signature and
      pin the expected algorithms.
    metadata:
      cwe: "CWE-347"
      owasp: "A02:2021 - Cryptographic Failures"
      category: ai-code
      ai_failure_mode: jwt-no-verify
    patterns:
      - pattern-either:
          - pattern: jwt.decode(..., verify=False, ...)
          - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'

  - id: ai-code-sql-string-build
    languages: [python]
    severity: ERROR
    message: >-
      SQL query assembled with string formatting/concatenation. AI defaults to
      building SQL by hand even when an ORM/parameterized API is available. Use
      parameterized queries (execute(sql, params)).
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021 - Injection"
      category: ai-code
      ai_failure_mode: sql-string-build
    patterns:
      - pattern-either:
          - pattern: $CUR.execute(f"...", ...)
          - pattern: $CUR.execute("..." % ..., ...)
          - pattern: $CUR.execute("..." + ..., ...)

  - id: ai-code-hardcoded-secret-default
    languages: [python]
    severity: ERROR
    message: >-
      Secret-looking value hardcoded as a default parameter. AI's favourite
      mistake — a baked-in credential that ships to production. Read secrets from
      the environment or a secret manager; default to None and fail loudly.
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: ai-code
      ai_failure_mode: hardcoded-secret
    patterns:
      - pattern: 'def $F(..., $P = $VAL, ...): ...'
      - metavariable-regex:
          metavariable: $P
          regex: (?i)^(password|passwd|secret|secret_key|api_key|apikey|token|access_key)$
      - metavariable-regex:
          metavariable: $VAL
          regex: ^["'].+["']$
