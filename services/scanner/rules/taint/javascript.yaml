rules:
  # ── SQL injection ────────────────────────────────────────────────────────────
  - id: aegis-js-sql-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Untrusted request data flows into a raw SQL query string. An attacker can
      alter the query. Use parameterized queries / placeholders
      (db.query("... WHERE id = ?", [value])) or a query builder that escapes
      values; never concatenate request data into SQL.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [javascript, typescript, node]
      references:
        - https://owasp.org/Top10/A03_2021-Injection/
    pattern-sources: &request_sources
      - pattern-either:
          - pattern: req.query
          - pattern: req.body
          - pattern: req.params
          - pattern: req.cookies
          - pattern: req.headers
          - pattern: request.query
          - pattern: request.body
          - pattern: request.params
          - pattern: request.cookies
          - pattern: request.headers
    pattern-sanitizers:
      - pattern-either:
          # Driver-level escaping / numeric coercion neutralize SQL metacharacters.
          - pattern: mysql.escape(...)
          - pattern: $CONN.escape(...)
          - pattern: sqlstring.escape(...)
          - pattern: Number(...)
          - pattern: parseInt(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($SQL, ...)
              - pattern: $DB.execute($SQL, ...)
              - pattern: $CONN.raw($SQL, ...)
          - focus-metavariable: $SQL

  # ── Cross-site scripting ─────────────────────────────────────────────────────
  - id: aegis-js-xss
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Untrusted request data is written to an HTTP response or the DOM without
      escaping, enabling XSS. Encode output for the HTML context
      (e.g. DOMPurify.sanitize(), he.encode(), validator.escape()) or render
      through a template engine with contextual autoescaping.
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [javascript, typescript, node, browser]
      references:
        - https://owasp.org/www-community/attacks/xss/
    pattern-sources: *request_sources
    pattern-sanitizers:
      - pattern-either:
          - pattern: DOMPurify.sanitize(...)
          - pattern: sanitizeHtml(...)
          - pattern: he.encode(...)
          - pattern: validator.escape(...)
          - pattern: escapeHtml(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.send($H)
              - pattern: $RES.write($H)
              - pattern: $RES.end($H)
              - pattern: $EL.innerHTML = $H
              - pattern: document.write($H)
          - focus-metavariable: $H

  # ── React XSS via dangerouslySetInnerHTML ────────────────────────────────────
  # Taint-mode by design: fires ONLY when the __html value traces to a user-
  # controlled source (searchParams / URL / router query / location / form input).
  # The safe static pattern — dangerouslySetInnerHTML={{__html: JSON.stringify(
  # constantSchema)}} for JSON-LD — has no tainted source and is NOT flagged.
  - id: aegis-react-xss
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      User-controlled data flows into React's dangerouslySetInnerHTML without
      sanitization, enabling XSS. Sanitize the HTML before rendering
      (DOMPurify.sanitize(value)), or render the value as text instead of raw
      HTML. Never pass query/URL/router/form input straight to __html.
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [javascript, typescript, react, nextjs, browser]
      references:
        - https://owasp.org/www-community/attacks/xss/
    pattern-sources:
      - pattern-either:
          # Next.js / React Router query string + URL (user-controlled).
          - pattern: useSearchParams()
          - pattern: searchParams.get(...)
          - pattern: searchParams
          - pattern: searchParams.$K
          - pattern: useRouter().query
          - pattern: $R.query
          - pattern: $R.query.$K
          # Browser location.
          - pattern: window.location.search
          - pattern: window.location.hash
          - pattern: window.location.href
          - pattern: location.search
          - pattern: location.hash
          - pattern: document.location.$X
          # Form / controlled-input values.
          - pattern: $E.target.value
    pattern-sanitizers:
      - pattern-either:
          - pattern: DOMPurify.sanitize(...)
          - pattern: sanitizeHtml(...)
          - pattern: sanitize(...)
          - pattern: he.encode(...)
          - pattern: validator.escape(...)
          - pattern: escapeHtml(...)
    pattern-sinks:
      # The {__html: …} object is React's dangerouslySetInnerHTML payload — a
      # precise, element-agnostic sink (this key is used for nothing else).
      - patterns:
          - pattern: "{__html: $HTML}"
          - focus-metavariable: $HTML

  # ── OS command injection ─────────────────────────────────────────────────────
  - id: aegis-js-command-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Untrusted request data flows into a shell command executed by child_process
      exec/execSync, allowing arbitrary command execution. Use execFile/spawn with
      an argument array (no shell), and validate the program name against an
      allowlist.
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [javascript, typescript, node]
      references:
        - https://owasp.org/www-community/attacks/Command_Injection
    pattern-sources: *request_sources
    pattern-sanitizers:
      - pattern-either:
          - pattern: shellQuote.quote(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: child_process.exec($CMD, ...)
              - pattern: child_process.execSync($CMD, ...)
              - pattern: cp.exec($CMD, ...)
              - pattern: cp.execSync($CMD, ...)
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
          - focus-metavariable: $CMD

  # ── Server-side request forgery ──────────────────────────────────────────────
  - id: aegis-js-ssrf
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Untrusted request data is used as the target URL of a server-side HTTP
      request (SSRF). Validate the URL against a strict host allowlist before
      issuing the request (e.g. an isAllowedUrl()/validateUrl() helper).
    metadata:
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp:
        - "A10:2021 - Server-Side Request Forgery (SSRF)"
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [javascript, typescript, node]
      references:
        - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
    pattern-sources: *request_sources
    pattern-sanitizers:
      - pattern-either:
          - pattern: isAllowedUrl(...)
          - pattern: validateUrl(...)
          - pattern: isSafeUrl(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: axios.get($U, ...)
              - pattern: axios.post($U, ...)
              - pattern: axios.put($U, ...)
              - pattern: axios.delete($U, ...)
              - pattern: axios($U, ...)
              - pattern: fetch($U, ...)
              - pattern: http.get($U, ...)
              - pattern: http.request($U, ...)
              - pattern: https.get($U, ...)
              - pattern: https.request($U, ...)
              - pattern: got($U, ...)
          - focus-metavariable: $U

  # ── Path traversal ───────────────────────────────────────────────────────────
  - id: aegis-js-path-traversal
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Untrusted request data flows into a filesystem path, enabling path
      traversal. Reduce to a bare filename with path.basename(), join under a
      fixed base directory, and verify the resolved path stays within it.
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [javascript, typescript, node]
      references:
        - https://owasp.org/www-community/attacks/Path_Traversal
    pattern-sources: *request_sources
    pattern-sanitizers:
      - pattern-either:
          - pattern: path.basename(...)
          - pattern: sanitizeFilename(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fs.readFile($P, ...)
              - pattern: fs.readFileSync($P, ...)
              - pattern: fs.createReadStream($P, ...)
              - pattern: fs.writeFile($P, ...)
              - pattern: fs.writeFileSync($P, ...)
              - pattern: fs.unlink($P, ...)
              - pattern: fs.unlinkSync($P, ...)
              - pattern: $RES.sendFile($P, ...)
          - focus-metavariable: $P

  # ── NoSQL injection (MongoDB) ────────────────────────────────────────────────
  - id: aegis-js-nosql-injection
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A user-controlled object is passed directly as a MongoDB query. When the
      value comes from req.body/req.query (parsed JSON or querystring), an
      attacker can inject query operators ($ne, $gt, $where) to bypass auth or
      extract data. Coerce query values to the expected scalar type
      (String(value), or an explicit ObjectId) before querying.
    metadata:
      cwe:
        - "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [javascript, typescript, node, mongodb]
      references:
        - https://owasp.org/www-community/Injection_Flaws
    pattern-sources: *request_sources
    pattern-sanitizers:
      - pattern-either:
          - pattern: String(...)
          - pattern: parseInt(...)
          - pattern: mongoSanitize(...)
          - pattern: ObjectId(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $COLL.find($Q, ...)
              - pattern: $COLL.findOne($Q, ...)
              - pattern: $COLL.findOneAndUpdate($Q, ...)
              - pattern: $COLL.update($Q, ...)
              - pattern: $COLL.updateOne($Q, ...)
              - pattern: $COLL.updateMany($Q, ...)
              - pattern: $COLL.deleteOne($Q, ...)
              - pattern: $COLL.deleteMany($Q, ...)
              - pattern: $COLL.remove($Q, ...)
          - focus-metavariable: $Q

  # ── LDAP injection ───────────────────────────────────────────────────────────
  - id: aegis-js-ldap-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Untrusted request data is used to build an LDAP search filter (ldapjs),
      enabling LDAP injection. Escape filter values before interpolation
      (e.g. an escapeFilter()/filterEscape() helper).
    metadata:
      cwe:
        - "CWE-90: Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [javascript, typescript, node, ldap]
      references:
        - https://owasp.org/www-community/attacks/LDAP_Injection
    pattern-sources: *request_sources
    pattern-sanitizers:
      - pattern-either:
          - pattern: escapeFilter(...)
          - pattern: filterEscape(...)
    pattern-sinks:
      - patterns:
          - pattern: $CLIENT.search($BASE, $OPTS, ...)
          - focus-metavariable: $OPTS

  # ── Code injection (eval / dynamic code) ─────────────────────────────────────
  - id: aegis-js-code-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Untrusted request data flows into a dynamic code-evaluation sink
      (eval / new Function / vm), allowing remote code execution. Never evaluate
      request data as code. Parse structured input with JSON.parse and validate
      it; for arithmetic use a safe expression evaluator, not eval.
    metadata:
      cwe:
        - "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [javascript, typescript, node]
      references:
        - https://owasp.org/www-community/attacks/Code_Injection
    pattern-sources: *request_sources
    pattern-sinks:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function(...)
          - pattern: vm.runInThisContext($X, ...)
          - pattern: vm.runInContext($X, ...)
          - pattern: vm.runInNewContext($X, ...)

  # ── MongoDB $where code injection (G1/A1) ────────────────────────────────────
  # NOT a taint rule on purpose. In the real-world shape (NodeGoat
  # allocations-dao.js:78) the DAO receives `threshold` as a plain function
  # parameter and the matching `req.query` lives in a DIFFERENT file, so no
  # intra-file taint engine — semgrep OSS or Opengrep --taint-intrafile — can
  # connect them. What IS local, and is decisive on its own, is the construct:
  # $where hands its argument to the database as JavaScript, so building it by
  # interpolation/concatenation is an injection sink regardless of provenance.
  - id: aegis-js-nosql-where-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A MongoDB $where clause is built from an interpolated or concatenated
      string. $where is evaluated as JavaScript by the database, so any value
      that reaches it is executed server-side — an attacker can hang the
      database ("0';while(true){}'") or subvert the query ("1'; return 1 == '1").
      Use typed query operators ($eq/$gt/$lt) instead; a $where clause should
      never be assembled from a variable.
    metadata:
      cwe:
        - "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [javascript, typescript, node, mongodb]
      references:
        - https://www.mongodb.com/docs/manual/reference/operator/query/where/
    patterns:
      - pattern-either:
          - pattern: "{..., $where: `...`, ...}"
          - pattern: "{..., $where: $A + $B, ...}"
          - pattern: "{..., \"$where\": `...`, ...}"
          - pattern: "{..., \"$where\": $A + $B, ...}"
      # A $where built from a constant carries no injection risk.
      - pattern-not: "{..., $where: \"...\", ...}"
      - pattern-not: "{..., \"$where\": \"...\", ...}"

  # ── Catastrophic-backtracking regex / ReDoS (G1/A2) ──────────────────────────
  # A nested quantifier — (X+)+ , (X*)*, (X+)* , (X*)+ — is redundant (it matches
  # exactly what (X+) matches) AND makes the matcher backtrack exponentially, so
  # its presence is itself the defect; no taint is required to justify flagging
  # it. NodeGoat profile.js:59 (/([0-9]+)+\#/, tested against req.body) is the
  # canonical case, and it is what CodeQL's js/redos caught and we missed (F2).
  - id: aegis-js-redos-nested-quantifier
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      This regular expression contains a nested quantifier ((X+)+ / (X*)* and
      friends), which causes catastrophic backtracking: a crafted input makes
      matching take exponential time and pins the event loop, denying service.
      The inner quantifier is also redundant — (X+)+ matches exactly what (X+)
      matches — so removing the outer one is behaviour-preserving.
    metadata:
      cwe:
        - "CWE-1333: Inefficient Regular Expression Complexity"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [javascript, typescript]
      references:
        - https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS
    patterns:
      - pattern: $RE
      - metavariable-regex:
          metavariable: $RE
          # a group whose last element is quantified, immediately re-quantified
          regex: ^/.*\([^()]*[+*]\)[+*].*/[gimsuy]*$
