# Pass N3 (2026-10-22): Python weakness rules. Written by Aegis from the CWE
# definitions and the Python stdlib / pycryptodome / cryptography / Flask /
# Django documentation; no registry or vendor rule text was used.
#
# Purpose-aware where purpose decides (random, hash, cookie, trust boundary);
# context-free only where the primitive itself is broken (DES, RC4, ECB, short
# RSA keys) -- each rule says which it is.
rules:
  - id: aegis-py-insecure-session-cookie
    languages: [python]
    # Django's own conf/global_settings.py is the framework's defaults table, not an
    # application's settings module.
    paths:
      exclude:
        - "**/django/conf/global_settings.py"
    severity: WARNING
    message: >-
      A session or authentication cookie is set without HttpOnly or without
      Secure, or the framework's session cookie has them switched off. Without
      HttpOnly any XSS can read it; without Secure it is sent over plain HTTP.
      Flask's and Django's set_cookie() default both to off. Pass secure=True,
      httponly=True (and samesite). CSRF cookies, which must stay readable, are
      not flagged.
    metadata:
      cwe:
        - "CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"
        - "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"
      owasp:
        - A05:2021 - Security Misconfiguration
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [python, flask, django, werkzeug]
      written-from: CWE-614, CWE-1004; Werkzeug Response.set_cookie and Django HttpResponse.set_cookie signatures; Django SESSION_COOKIE_* and Flask SESSION_COOKIE_* / REMEMBER_COOKIE_* settings docs
      references:
        - https://docs.djangoproject.com/en/stable/ref/request-response/#django.http.HttpResponse.set_cookie
        - https://flask.palletsprojects.com/en/stable/config/#SESSION_COOKIE_SECURE
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $R.set_cookie($NAME, ...)
              - pattern: $R.set_cookie(key=$NAME, ...)
          - pattern-not: $R.set_cookie(..., **$KW)
          # an empty value deletes the cookie (N4: PyGoat auth_failure_lab)
          - pattern-not: $R.set_cookie($NAME, "", ...)
          - pattern-not: $R.set_cookie(key=$NAME, value="", ...)
          - pattern-either:
              - pattern: $R.set_cookie(..., secure=False, ...)
              - pattern: $R.set_cookie(..., httponly=False, ...)
              - patterns:
                  - pattern: $R.set_cookie(...)
                  - pattern-not: $R.set_cookie(..., secure=$S, ...)
              - patterns:
                  - pattern: $R.set_cookie(...)
                  - pattern-not: $R.set_cookie(..., httponly=$H, ...)
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i)^(?!.*(csrf|xsrf)).*(sess|sid|auth|token|jwt|remember|login|refresh|access|identity|credential).*$
      - pattern: SESSION_COOKIE_SECURE = False
      - pattern: SESSION_COOKIE_HTTPONLY = False
      - pattern: REMEMBER_COOKIE_SECURE = False
      - pattern: REMEMBER_COOKIE_HTTPONLY = False
      - pattern: $APP.config["SESSION_COOKIE_SECURE"] = False
      - pattern: $APP.config["SESSION_COOKIE_HTTPONLY"] = False
      - pattern: $APP.config["REMEMBER_COOKIE_SECURE"] = False
      - pattern: $APP.config["REMEMBER_COOKIE_HTTPONLY"] = False
      - pattern: $APP.config.update(..., SESSION_COOKIE_SECURE=False, ...)
      - pattern: $APP.config.update(..., SESSION_COOKIE_HTTPONLY=False, ...)

  # N5. Context-free on purpose: the Werkzeug debugger the flag turns on is an
  # in-browser Python console, so the setting is the vulnerability wherever the app
  # is reachable. Only a literal True is flagged; a value read from the environment
  # or config is a deployment decision we cannot see.
  - id: aegis-py-flask-debug-enabled
    languages: [python]
    severity: ERROR
    message: >-
      The Flask app runs with debug mode on. Debug mode enables the Werkzeug
      interactive debugger, which lets anyone who can trigger an error execute
      arbitrary Python in the server process, and it shows source and config in
      tracebacks. Never enable it outside local development; read it from the
      environment and default it to off.
    metadata:
      cwe:
        - "CWE-489: Active Debug Code"
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp:
        - A05:2021 - Security Misconfiguration
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [python, flask, werkzeug]
      written-from: CWE-489; Flask "Debug Mode" and Flask.run(debug=) / DEBUG config documentation; Werkzeug debugger security notes
      references:
        - https://flask.palletsprojects.com/en/stable/debugging/
        - https://werkzeug.palletsprojects.com/en/stable/debug/#debugger-pin
    patterns:
      - pattern-either:
          - pattern-inside: |
              $APP = Flask(...)
              ...
          - pattern-inside: |
              $APP = flask.Flask(...)
              ...
      - pattern-either:
          - pattern: $APP.run(..., debug=True, ...)
          - pattern: $APP.debug = True
          - pattern: $APP.config["DEBUG"] = True
          - pattern: $APP.config.update(..., DEBUG=True, ...)

  - id: aegis-py-weak-cipher
    languages: [python]
    severity: ERROR
    message: >-
      A broken cipher or mode is used: DES (56-bit key, brute-forced in hours),
      3DES (64-bit block, Sweet32; withdrawn by NIST), RC4/ARC4 (biased
      keystream), RC2, Blowfish/CAST5/IDEA (64-bit blocks), or ECB mode (equal
      plaintext blocks give equal ciphertext blocks, so structure leaks). This
      needs no context: there is no safe use of these for confidentiality. Use
      AES-GCM or ChaCha20-Poly1305 (an AEAD).
    metadata:
      aegis-validation: silent-clean   # N4: API-shaped, 0 FP on the N3 corpus, never fired on real code; recall unvalidated, not counted as coverage
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp:
        - A02:2021 - Cryptographic Failures
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [python, pycryptodome, cryptography]
      written-from: CWE-327; NIST SP 800-131A Rev.2 (3DES disallowed); pycryptodome and cryptography (hazmat) cipher docs
      references:
        - https://csrc.nist.gov/pubs/sp/800/131/a/r2/final
    pattern-either:
      - pattern: Crypto.Cipher.DES.new(...)
      - pattern: Crypto.Cipher.DES3.new(...)
      - pattern: Crypto.Cipher.ARC4.new(...)
      - pattern: Crypto.Cipher.ARC2.new(...)
      - pattern: Crypto.Cipher.Blowfish.new(...)
      - pattern: Crypto.Cipher.CAST.new(...)
      - pattern: Crypto.Cipher.XOR.new(...)
      - pattern: Cryptodome.Cipher.DES.new(...)
      - pattern: Cryptodome.Cipher.DES3.new(...)
      - pattern: Cryptodome.Cipher.ARC4.new(...)
      - pattern: Cryptodome.Cipher.ARC2.new(...)
      - pattern: Cryptodome.Cipher.Blowfish.new(...)
      - pattern: Cryptodome.Cipher.CAST.new(...)
      - pattern: Crypto.Cipher.$C.new($K, Crypto.Cipher.$C.MODE_ECB, ...)
      - pattern: Cryptodome.Cipher.$C.new($K, Cryptodome.Cipher.$C.MODE_ECB, ...)
      - pattern: $C.new($K, $C.MODE_ECB, ...)
      - pattern: $C.new($K, mode=$C.MODE_ECB, ...)
      - pattern: cryptography.hazmat.primitives.ciphers.algorithms.TripleDES(...)
      - pattern: cryptography.hazmat.primitives.ciphers.algorithms.ARC4(...)
      - pattern: cryptography.hazmat.primitives.ciphers.algorithms.Blowfish(...)
      - pattern: cryptography.hazmat.primitives.ciphers.algorithms.CAST5(...)
      - pattern: cryptography.hazmat.primitives.ciphers.algorithms.IDEA(...)
      - pattern: cryptography.hazmat.primitives.ciphers.algorithms.SEED(...)
      - pattern: cryptography.hazmat.decrepit.ciphers.algorithms.$ALG(...)
      - pattern: cryptography.hazmat.primitives.ciphers.modes.ECB(...)
      - pattern: pyDes.des(...)
      - pattern: pyDes.triple_des(...)

  - id: aegis-py-weak-key-size
    languages: [python]
    severity: ERROR
    message: >-
      An RSA or DSA key shorter than 2048 bits is generated. 1024-bit RSA is
      within reach of well-resourced attackers and below every current minimum
      (NIST SP 800-57, 800-131A). This needs no context. Generate 2048-bit keys
      or larger (3072 for use beyond 2030), or use an elliptic-curve key.
    metadata:
      aegis-validation: silent-clean   # N4: API-shaped, 0 FP on the N3 corpus, never fired on real code; recall unvalidated, not counted as coverage
      cwe:
        - "CWE-326: Inadequate Encryption Strength"
      owasp:
        - A02:2021 - Cryptographic Failures
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: LOW
      impact: HIGH
      technology: [python, pycryptodome, cryptography]
      written-from: CWE-326; NIST SP 800-57 Part 1 key-length tables; cryptography and pycryptodome key-generation docs
      references:
        - https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final
    patterns:
      - pattern-either:
          - pattern: cryptography.hazmat.primitives.asymmetric.rsa.generate_private_key(..., key_size=$N, ...)
          - pattern: cryptography.hazmat.primitives.asymmetric.rsa.generate_private_key($E, $N, ...)
          - pattern: cryptography.hazmat.primitives.asymmetric.dsa.generate_private_key(..., key_size=$N, ...)
          - pattern: cryptography.hazmat.primitives.asymmetric.dsa.generate_private_key($N, ...)
          - pattern: Crypto.PublicKey.RSA.generate($N, ...)
          - pattern: Crypto.PublicKey.DSA.generate($N, ...)
          - pattern: Cryptodome.PublicKey.RSA.generate($N, ...)
          - pattern: Cryptodome.PublicKey.DSA.generate($N, ...)
          - pattern: Crypto.PublicKey.RSA.generate(bits=$N, ...)
      - metavariable-comparison:
          metavariable: $N
          comparison: $N < 2048

