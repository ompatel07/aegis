rules:
  # ── SQL injection ────────────────────────────────────────────────────────────
  - id: aegis-py-sql-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted request data flows into a raw SQL query string. An attacker can
      alter the query (read/modify arbitrary rows, exfiltrate data). Use
      parameterized queries: pass values as bind parameters
      (cursor.execute("... WHERE id = %s", (value,))) or an ORM, never string
      concatenation / f-strings.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [python]
      references:
        - https://owasp.org/Top10/A03_2021-Injection/
        - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.form[...]
          - pattern: request.values.get(...)
          - pattern: request.values[...]
          - pattern: request.json
          - pattern: request.get_json(...)
          - pattern: request.data
          - pattern: request.cookies.get(...)
          - pattern: request.headers.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
          - pattern: request.GET[...]
          - pattern: request.POST[...]
          - pattern: flask.request.args.get(...)
          - pattern: flask.request.form.get(...)
          - pattern: self.get_argument(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: int(...)
          - pattern: float(...)
          - pattern: sqlalchemy.text(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CUR.execute($QUERY, ...)
              - pattern: $CUR.executemany($QUERY, ...)
              - pattern: $CUR.executescript($QUERY, ...)
          - focus-metavariable: $QUERY

  # ── Cross-site scripting (reflected) ─────────────────────────────────────────
  - id: aegis-py-xss
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted request data is rendered into HTML without escaping, enabling
      reflected XSS. Escape output with markupsafe.escape() / html.escape(), or
      render through a template engine with autoescaping enabled; never build
      HTML by concatenating request data.
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [python, flask]
      references:
        - https://owasp.org/www-community/attacks/xss/
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.form[...]
          - pattern: request.values.get(...)
          - pattern: request.cookies.get(...)
          - pattern: request.headers.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: markupsafe.escape(...)
          - pattern: escape(...)
          - pattern: html.escape(...)
          - pattern: bleach.clean(...)
          - pattern: int(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: flask.render_template_string(...)
              - pattern: render_template_string(...)
              - pattern: markupsafe.Markup(...)
              - pattern: Markup(...)
              - pattern: django.http.HttpResponse(...)
              - pattern: HttpResponse(...)

  # ── OS command injection ─────────────────────────────────────────────────────
  - id: aegis-py-command-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted request data flows into an OS command executed through a shell.
      This allows arbitrary command execution. Avoid shell=True; pass an argument
      list to subprocess.run([...]) so arguments are not interpreted by a shell,
      or escape with shlex.quote().
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [python]
      references:
        - https://owasp.org/www-community/attacks/Command_Injection
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.form[...]
          - pattern: request.values.get(...)
          - pattern: request.json
          - pattern: request.get_json(...)
          - pattern: request.cookies.get(...)
          - pattern: request.headers.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: shlex.quote(...)
          - pattern: int(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.system($CMD)
              - pattern: os.popen($CMD, ...)
              - patterns:
                  - pattern-either:
                      - pattern: subprocess.call($CMD, ..., shell=True)
                      - pattern: subprocess.run($CMD, ..., shell=True)
                      - pattern: subprocess.Popen($CMD, ..., shell=True)
                      - pattern: subprocess.check_output($CMD, ..., shell=True)
                      - pattern: subprocess.check_call($CMD, ..., shell=True)
          - focus-metavariable: $CMD

  # ── Server-side request forgery ──────────────────────────────────────────────
  - id: aegis-py-ssrf
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted request data is used as the target URL of a server-side HTTP
      request (SSRF). An attacker can pivot to internal services or cloud
      metadata endpoints. Validate the URL against a strict host allowlist before
      the request (e.g. a validate_url()/is_safe_url() helper).
    metadata:
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp:
        - "A10:2021 - Server-Side Request Forgery (SSRF)"
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [python]
      references:
        - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.values.get(...)
          - pattern: request.json
          - pattern: request.get_json(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: validate_url(...)
          - pattern: is_safe_url(...)
          - pattern: is_allowed_url(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: requests.get($URL, ...)
              - pattern: requests.post($URL, ...)
              - pattern: requests.put($URL, ...)
              - pattern: requests.delete($URL, ...)
              - pattern: requests.head($URL, ...)
              - pattern: requests.patch($URL, ...)
              - pattern: requests.request($M, $URL, ...)
              - pattern: urllib.request.urlopen($URL, ...)
              - pattern: urllib.request.Request($URL, ...)
              - pattern: httpx.get($URL, ...)
              - pattern: httpx.post($URL, ...)
          - focus-metavariable: $URL

  # ── Path traversal ───────────────────────────────────────────────────────────
  - id: aegis-py-path-traversal
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted request data flows into a filesystem path, enabling path
      traversal (../../etc/passwd) to read or write files outside the intended
      directory. Reduce to a bare filename with os.path.basename() /
      werkzeug.secure_filename(), then join under a fixed base directory and
      verify the resolved path stays within it.
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [python]
      references:
        - https://owasp.org/www-community/attacks/Path_Traversal
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.values.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: os.path.basename(...)
          - pattern: werkzeug.utils.secure_filename(...)
          - pattern: secure_filename(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($PATH, ...)
              - pattern: io.open($PATH, ...)
              - pattern: os.remove($PATH)
              - pattern: os.unlink($PATH)
              - pattern: shutil.rmtree($PATH)
              - pattern: flask.send_file($PATH, ...)
              - pattern: send_file($PATH, ...)
          - focus-metavariable: $PATH

  # ── NoSQL injection (MongoDB / PyMongo) ──────────────────────────────────────
  - id: aegis-py-nosql-injection
    mode: taint
    languages: [python]
    severity: WARNING
    message: >-
      A user-controlled object is passed directly as a MongoDB query. If the
      value is a dict parsed from request JSON, an attacker can inject query
      operators ($ne, $gt, $where) to bypass authentication or extract data.
      Coerce query values to the expected scalar type (str/ObjectId) instead of
      passing raw request objects.
    metadata:
      cwe:
        - "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [python, mongodb]
      references:
        - https://owasp.org/www-community/Injection_Flaws
    pattern-sources:
      - pattern-either:
          - pattern: request.json
          - pattern: request.get_json(...)
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
          - pattern: request.values.get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: str(...)
          - pattern: bson.ObjectId(...)
          - pattern: ObjectId(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $COLL.find($QUERY, ...)
              - pattern: $COLL.find_one($QUERY, ...)
              - pattern: $COLL.delete_one($QUERY, ...)
              - pattern: $COLL.delete_many($QUERY, ...)
              - pattern: $COLL.update_one($QUERY, ...)
              - pattern: $COLL.update_many($QUERY, ...)
          - focus-metavariable: $QUERY

  # ── LDAP injection ───────────────────────────────────────────────────────────
  - id: aegis-py-ldap-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted request data is used to build an LDAP search filter, enabling
      LDAP injection (authentication bypass, data disclosure). Escape filter
      values with ldap.filter.escape_filter_chars() before interpolating them.
    metadata:
      cwe:
        - "CWE-90: Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [python, ldap]
      references:
        - https://owasp.org/www-community/attacks/LDAP_Injection
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
          - pattern: request.values.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: ldap.filter.escape_filter_chars(...)
          - pattern: escape_filter_chars(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CONN.search_s($BASE, $SCOPE, $FILTER, ...)
              - pattern: $CONN.search_ext_s($BASE, $SCOPE, $FILTER, ...)
              - pattern: $CONN.search($BASE, $SCOPE, $FILTER, ...)
          - focus-metavariable: $FILTER

  # ── Code injection (eval / exec) ─────────────────────────────────────────────
  - id: aegis-py-code-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted request data is passed to eval()/exec()/compile(), allowing
      arbitrary Python execution (RCE). Never evaluate request data as code. For
      literals use ast.literal_eval(); for numbers use int()/float(); otherwise
      parse and validate explicitly.
    metadata:
      cwe:
        - "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [python]
      references:
        - https://owasp.org/www-community/attacks/Code_Injection
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.form[...]
          - pattern: request.values.get(...)
          - pattern: request.json
          - pattern: request.get_json(...)
          - pattern: request.cookies.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: ast.literal_eval(...)
          - pattern: int(...)
          - pattern: float(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($X, ...)
              - pattern: exec($X, ...)
              - pattern: compile($X, ...)
          - focus-metavariable: $X
