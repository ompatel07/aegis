rules:
  # ── SQL injection ────────────────────────────────────────────────────────────
  - id: aegis-py-sql-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted request data flows into a raw SQL query string. An attacker can
      alter the query (read/modify arbitrary rows, exfiltrate data). Use
      parameterized queries: pass values as bind parameters
      (cursor.execute("... WHERE id = %s", (value,))) or an ORM, never string
      concatenation / f-strings.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [python]
      references:
        - https://owasp.org/Top10/A03_2021-Injection/
        - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.form[...]
          - pattern: request.values.get(...)
          - pattern: request.values[...]
          - pattern: request.json
          - pattern: request.get_json(...)
          - pattern: request.data
          - pattern: request.cookies.get(...)
          - pattern: request.headers.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
          - pattern: request.GET[...]
          - pattern: request.POST[...]
          - pattern: flask.request.args.get(...)
          - pattern: flask.request.form.get(...)
          - pattern: self.get_argument(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: int(...)
          - pattern: float(...)
          - pattern: sqlalchemy.text(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CUR.execute($QUERY, ...)
              - pattern: $CUR.executemany($QUERY, ...)
              - pattern: $CUR.executescript($QUERY, ...)
          - focus-metavariable: $QUERY

  # ── Cross-site scripting (reflected) ─────────────────────────────────────────
  - id: aegis-py-xss
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted request data is rendered into HTML without escaping, enabling
      reflected XSS. Escape output with markupsafe.escape() / html.escape(), or
      render through a template engine with autoescaping enabled; never build
      HTML by concatenating request data.
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [python, flask]
      references:
        - https://owasp.org/www-community/attacks/xss/
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.form[...]
          - pattern: request.values.get(...)
          - pattern: request.cookies.get(...)
          - pattern: request.headers.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: markupsafe.escape(...)
          - pattern: escape(...)
          - pattern: html.escape(...)
          - pattern: bleach.clean(...)
          - pattern: int(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: flask.render_template_string(...)
              - pattern: render_template_string(...)
              - pattern: markupsafe.Markup(...)
              - pattern: Markup(...)
              - pattern: django.http.HttpResponse(...)
              - pattern: HttpResponse(...)

  # ── OS command injection ─────────────────────────────────────────────────────
  - id: aegis-py-command-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted request data flows into an OS command executed through a shell.
      This allows arbitrary command execution. Avoid shell=True; pass an argument
      list to subprocess.run([...]) so arguments are not interpreted by a shell,
      or escape with shlex.quote().
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [python]
      references:
        - https://owasp.org/www-community/attacks/Command_Injection
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.form[...]
          - pattern: request.values.get(...)
          - pattern: request.json
          - pattern: request.get_json(...)
          - pattern: request.cookies.get(...)
          - pattern: request.headers.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: shlex.quote(...)
          - pattern: int(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.system($CMD)
              - pattern: os.popen($CMD, ...)
              - patterns:
                  - pattern-either:
                      - pattern: subprocess.call($CMD, ..., shell=True)
                      - pattern: subprocess.run($CMD, ..., shell=True)
                      - pattern: subprocess.Popen($CMD, ..., shell=True)
                      - pattern: subprocess.check_output($CMD, ..., shell=True)
                      - pattern: subprocess.check_call($CMD, ..., shell=True)
          - focus-metavariable: $CMD

  # ── Server-side request forgery ──────────────────────────────────────────────
  - id: aegis-py-ssrf
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted request data is used as the target URL of a server-side HTTP
      request (SSRF). An attacker can pivot to internal services or cloud
      metadata endpoints. Validate the URL against a strict host allowlist before
      the request (e.g. a validate_url()/is_safe_url() helper).
    metadata:
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp:
        - "A10:2021 - Server-Side Request Forgery (SSRF)"
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [python]
      references:
        - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.values.get(...)
          - pattern: request.json
          - pattern: request.get_json(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: validate_url(...)
          - pattern: is_safe_url(...)
          - pattern: is_allowed_url(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: requests.get($URL, ...)
              - pattern: requests.post($URL, ...)
              - pattern: requests.put($URL, ...)
              - pattern: requests.delete($URL, ...)
              - pattern: requests.head($URL, ...)
              - pattern: requests.patch($URL, ...)
              - pattern: requests.request($M, $URL, ...)
              - pattern: urllib.request.urlopen($URL, ...)
              - pattern: urllib.request.Request($URL, ...)
              - pattern: httpx.get($URL, ...)
              - pattern: httpx.post($URL, ...)
          - focus-metavariable: $URL

  # ── Path traversal ───────────────────────────────────────────────────────────
  - id: aegis-py-path-traversal
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted request data flows into a filesystem path, enabling path
      traversal (../../etc/passwd) to read or write files outside the intended
      directory. Reduce to a bare filename with os.path.basename() /
      werkzeug.secure_filename(), then join under a fixed base directory and
      verify the resolved path stays within it.
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [python]
      references:
        - https://owasp.org/www-community/attacks/Path_Traversal
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.values.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: os.path.basename(...)
          - pattern: werkzeug.utils.secure_filename(...)
          - pattern: secure_filename(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($PATH, ...)
              - pattern: io.open($PATH, ...)
              - pattern: os.remove($PATH)
              - pattern: os.unlink($PATH)
              - pattern: shutil.rmtree($PATH)
              - pattern: flask.send_file($PATH, ...)
              - pattern: send_file($PATH, ...)
          - focus-metavariable: $PATH

  # ── NoSQL injection (MongoDB / PyMongo) ──────────────────────────────────────
  - id: aegis-py-nosql-injection
    mode: taint
    languages: [python]
    severity: WARNING
    message: >-
      A user-controlled object is passed directly as a MongoDB query. If the
      value is a dict parsed from request JSON, an attacker can inject query
      operators ($ne, $gt, $where) to bypass authentication or extract data.
      Coerce query values to the expected scalar type (str/ObjectId) instead of
      passing raw request objects.
    metadata:
      cwe:
        - "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [python, mongodb]
      references:
        - https://owasp.org/www-community/Injection_Flaws
    pattern-sources:
      - pattern-either:
          - pattern: request.json
          - pattern: request.get_json(...)
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
          - pattern: request.values.get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: str(...)
          - pattern: bson.ObjectId(...)
          - pattern: ObjectId(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $COLL.find($QUERY, ...)
              - pattern: $COLL.find_one($QUERY, ...)
              - pattern: $COLL.delete_one($QUERY, ...)
              - pattern: $COLL.delete_many($QUERY, ...)
              - pattern: $COLL.update_one($QUERY, ...)
              - pattern: $COLL.update_many($QUERY, ...)
          - focus-metavariable: $QUERY

  # ── LDAP injection ───────────────────────────────────────────────────────────
  - id: aegis-py-ldap-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted request data is used to build an LDAP search filter, enabling
      LDAP injection (authentication bypass, data disclosure). Escape filter
      values with ldap.filter.escape_filter_chars() before interpolating them.
    metadata:
      cwe:
        - "CWE-90: Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [python, ldap]
      references:
        - https://owasp.org/www-community/attacks/LDAP_Injection
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
          - pattern: request.values.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: ldap.filter.escape_filter_chars(...)
          - pattern: escape_filter_chars(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CONN.search_s($BASE, $SCOPE, $FILTER, ...)
              - pattern: $CONN.search_ext_s($BASE, $SCOPE, $FILTER, ...)
              - pattern: $CONN.search($BASE, $SCOPE, $FILTER, ...)
          - focus-metavariable: $FILTER

  # ── Code injection (eval / exec) ─────────────────────────────────────────────
  - id: aegis-py-code-injection
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Untrusted request data is passed to eval()/exec()/compile(), allowing
      arbitrary Python execution (RCE). Never evaluate request data as code. For
      literals use ast.literal_eval(); for numbers use int()/float(); otherwise
      parse and validate explicitly.
    metadata:
      cwe:
        - "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [python]
      references:
        - https://owasp.org/www-community/attacks/Code_Injection
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.form[...]
          - pattern: request.values.get(...)
          - pattern: request.json
          - pattern: request.get_json(...)
          - pattern: request.cookies.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: ast.literal_eval(...)
          - pattern: int(...)
          - pattern: float(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($X, ...)
              - pattern: exec($X, ...)
              - pattern: compile($X, ...)
          - focus-metavariable: $X

  # ══ Python security pack (H1) ═══════════════════════════════════════════════
  # Pattern rules, not taint. Our eight aegis-py-* TAINT rules yield zero on real
  # code because they need a request source in the same file (V2 §4, G2/G3). These
  # detect the construct itself, which is what actually fires.
  #
  # Each rule below is an INDEPENDENT implementation of the behaviour described by
  # the named Bandit check. Bandit is Apache-2.0; we reimplement what each check
  # DETECTS. No Bandit source, rule text, message string or test fixture was copied
  # — the patterns, messages and fixtures here are our own, and several are
  # deliberately NARROWER than the described behaviour in order to hold a 0-FP gate.

  - id: aegis-py-sql-string-construction
    languages: [python]
    severity: ERROR
    message: >-
      This SQL statement is assembled by string formatting or concatenation. Any
      value interpolated here is parsed as SQL, so a quote or a comment marker in
      the data rewrites the query. Pass values as bind parameters instead --
      cursor.execute("... WHERE id = %s", (value,)) for DB-API, or bound parameters
      via sqlalchemy.text(); string building is unsafe even when the value looks
      numeric.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [python]
      independent-implementation-of: "behaviour described by Bandit B608 (hardcoded SQL expressions)"
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
    patterns:
      - pattern-either:
          # Built inline in the call: cur.execute("... %s" % value)
          - patterns:
              - pattern-either:
                  - pattern: $C.execute($SQL, ...)
                  - pattern: $C.executemany($SQL, ...)
                  - pattern: text($SQL)
                  - pattern: sqlalchemy.text($SQL)
              - metavariable-pattern:
                  metavariable: $SQL
                  patterns:
                    - pattern-either:
                        - pattern: $A % $B
                        - pattern: $A.format(...)
                        - pattern: $A + $B
                        - pattern: f"..."
              - focus-metavariable: $SQL
          # Built into a variable first, executed later (possibly elsewhere).
          # Requires real SQL STRUCTURE -- verb plus its clause -- not merely a
          # SQL-ish word, so a log line like "update %s failed" does not match.
          - patterns:
              - pattern-either:
                  - pattern: $Q = $A % $B
                  - pattern: $Q = $A.format(...)
                  - pattern: $Q = $A + $B
              - metavariable-regex:
                  metavariable: $A
                  regex: (?is).*(\bselect\b.*\bfrom\b|\binsert\s+into\b|\bupdate\b.*\bset\b|\bdelete\s+from\b|\bcreate\s+table\b|\bdrop\s+table\b).*

  - id: aegis-py-shell-command-construction
    languages: [python]
    severity: ERROR
    message: >-
      An OS command is built by string formatting or concatenation and handed to a
      shell. Shell metacharacters in any interpolated value (; | && $() backticks)
      are executed as further commands. Pass an argument list to subprocess with no
      shell -- subprocess.run(["mv", src, dst]) -- so the values can never be parsed
      as syntax.
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [python]
      independent-implementation-of: "behaviour described by Bandit B602/B605 (subprocess or os.system invoked through a shell)"
      references:
        - https://owasp.org/www-community/attacks/Command_Injection
    patterns:
      - pattern-either:
          - pattern: os.system($CMD)
          - pattern: os.popen($CMD, ...)
          - pattern: subprocess.call($CMD, ..., shell=True, ...)
          - pattern: subprocess.run($CMD, ..., shell=True, ...)
          - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_call($CMD, ..., shell=True, ...)
      # Only when the command is BUILT, not a fixed string: a constant command
      # carries no injection point.
      - metavariable-pattern:
          metavariable: $CMD
          patterns:
            - pattern-either:
                - pattern: $A % $B
                - pattern: $A.format(...)
                - pattern: $A + $B
                - pattern: f"..."
      - focus-metavariable: $CMD

  - id: aegis-py-weak-hash-credential
    languages: [python]
    severity: ERROR
    message: >-
      A credential is being hashed with MD5 or SHA-1. Both are fast and broken for
      this purpose -- brute-forceable at scale, and SHA-1 has practical collisions.
      Use a slow, salted password hash: argon2, scrypt or bcrypt. This rule is
      deliberately scoped to credential-named values, because MD5 over a cache key
      or an ETag is not a vulnerability and is not flagged.
    metadata:
      cwe:
        - "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [python]
      independent-implementation-of: "behaviour described by Bandit B303/B324 (weak hash algorithms), narrowed here to a credential context"
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
    patterns:
      - pattern-either:
          - pattern: hashlib.md5($ARG, ...)
          - pattern: hashlib.sha1($ARG, ...)
          - pattern: md5($ARG, ...)
          - pattern: sha1($ARG, ...)
      # An explicit non-security declaration is respected, not argued with.
      - pattern-not: hashlib.md5(..., usedforsecurity=False)
      - pattern-not: hashlib.sha1(..., usedforsecurity=False)
      # The discriminator: fire only when the value being hashed is a credential.
      - metavariable-regex:
          metavariable: $ARG
          regex: (?i).*(password|passwd|pwd|secret|token|credential|api_?key|private_?key|passphrase).*

  - id: aegis-py-tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: >-
      TLS certificate verification is switched off for this request, so the
      connection is encrypted but not authenticated: anyone on the network path can
      present their own certificate and read or alter the traffic. Leave
      verification enabled; for a private CA, pass its bundle as
      verify="/path/to/ca.pem".
    metadata:
      cwe:
        - "CWE-295: Improper Certificate Validation"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [python, requests]
      independent-implementation-of: "behaviour described by Bandit B501 (request with certificate verification disabled)"
      references:
        - https://cwe.mitre.org/data/definitions/295.html
    pattern-either:
      - pattern: requests.get(..., verify=False, ...)
      - pattern: requests.post(..., verify=False, ...)
      - pattern: requests.put(..., verify=False, ...)
      - pattern: requests.patch(..., verify=False, ...)
      - pattern: requests.delete(..., verify=False, ...)
      - pattern: requests.head(..., verify=False, ...)
      - pattern: requests.request(..., verify=False, ...)
      - pattern: $S.get(..., verify=False, ...)
      - pattern: $S.post(..., verify=False, ...)
      - pattern: $S.request(..., verify=False, ...)
