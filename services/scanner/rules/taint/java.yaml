rules:
  # ── SQL injection ────────────────────────────────────────────────────────────
  - id: aegis-java-sql-injection
    mode: taint
    languages: [java]
    severity: ERROR
    message: >-
      Untrusted request data flows into a raw SQL statement. Use a
      PreparedStatement with '?' placeholders and setXxx() bind parameters, never
      string concatenation of request data into the query.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [java]
      references:
        - https://owasp.org/Top10/A03_2021-Injection/
    pattern-sources: &request_sources
      # Servlet API — javax/jakarta.servlet.HttpServletRequest. Plenty of Java is
      # still servlet-based, so these stay.
      - pattern-either:
          - pattern: $REQ.getParameter(...)
          - pattern: $REQ.getParameterValues(...)
          - pattern: $REQ.getHeader(...)
          - pattern: $REQ.getHeaders(...)
          - pattern: $REQ.getQueryString()
          - pattern: $REQ.getCookies()
      # Spring MVC annotated controller parameters. WebGoat and most modern Java
      # apps take input via @RequestParam / @PathVariable / … — there is no
      # getParameter() call to match, which is why this pack was INERT on every Java
      # repo before T3. Semgrep OSS cannot bind a bare annotated parameter as a
      # source (the parenthesised-parameter pattern fails to parse for Java); it CAN
      # when the whole method is matched and the parameter is the focus. @X(...)
      # matches both @X and @X("name"). BOUNDARY: semgrep OSS taint is
      # INTRAPROCEDURAL — only a source→sink flow WITHIN one method fires. A handler
      # that passes the value to a helper (WebGoat SqlInjectionLesson5b, SSRFTask2)
      # is a real miss of the engine, not a defect of these patterns.
      - patterns:
          - pattern-either:
              - pattern: |
                  $RT $M(..., @RequestParam(...) $T $SRC, ...) { ... }
              - pattern: |
                  $RT $M(..., @PathVariable(...) $T $SRC, ...) { ... }
              - pattern: |
                  $RT $M(..., @RequestHeader(...) $T $SRC, ...) { ... }
              - pattern: |
                  $RT $M(..., @CookieValue(...) $T $SRC, ...) { ... }
              - pattern: |
                  $RT $M(..., @ModelAttribute(...) $T $SRC, ...) { ... }
              - pattern: |
                  $RT $M(..., @RequestBody(...) $T $SRC, ...) { ... }
          - focus-metavariable: $SRC
      # Spring WebFlux request accessors (ServerHttpRequest / ServerRequest).
      - pattern-either:
          - pattern: $REQ.getQueryParams().get(...)
          - pattern: $REQ.getQueryParams().getFirst(...)
          - pattern: $REQ.queryParam(...)
          - pattern: $REQ.pathVariable(...)
    pattern-sanitizers:
      - pattern-either:
          # Real-world SQL defenses: ESAPI SQL codec encoding + numeric coercion
          # of untrusted values (an int/long can't carry SQL syntax).
          - pattern: ESAPI.encoder().encodeForSQL(...)
          - pattern: org.owasp.esapi.ESAPI.encoder().encodeForSQL(...)
          - pattern: Integer.parseInt(...)
          - pattern: Long.parseLong(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $STMT.executeQuery($SQL)
              - pattern: $STMT.execute($SQL)
              - pattern: $STMT.executeUpdate($SQL)
              - pattern: $STMT.executeLargeUpdate($SQL)
              # WebGoat's SqlInjectionLesson5b uses the 3-arg prepareStatement
              # (query, resultSetType, concurrency); the 1-arg form missed it. The
              # ($SQL, ...) ellipsis covers 1-arg and every multi-arg overload.
              - pattern: $CONN.prepareStatement($SQL, ...)
              - pattern: $CONN.prepareCall($SQL, ...)
          - focus-metavariable: $SQL

  # ── Cross-site scripting ─────────────────────────────────────────────────────
  - id: aegis-java-xss
    mode: taint
    languages: [java]
    severity: ERROR
    message: >-
      Untrusted request data is written to the HTTP response without HTML
      encoding, enabling XSS. Encode output with OWASP Encoder
      (Encode.forHtml(value)) or a template engine with contextual autoescaping.
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [java, servlet]
      references:
        - https://owasp.org/www-community/attacks/xss/
    pattern-sources: *request_sources
    pattern-sanitizers:
      - pattern-either:
          - pattern: org.owasp.encoder.Encode.forHtml(...)
          - pattern: Encode.forHtml(...)
          - pattern: Encode.forHtmlContent(...)
          - pattern: Encode.forHtmlAttribute(...)
          - pattern: Encode.forJavaScript(...)
          - pattern: ESAPI.encoder().encodeForHTML(...)
          - pattern: ESAPI.encoder().encodeForHTMLAttribute(...)
          - pattern: org.owasp.esapi.ESAPI.encoder().encodeForHTML(...)
          - pattern: StringEscapeUtils.escapeHtml4(...)
          - pattern: StringEscapeUtils.escapeHtml3(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              # Direct: resp.getWriter().println(userData).
              - pattern: $RESP.getWriter().write($S)
              - pattern: $RESP.getWriter().print($S)
              - pattern: $RESP.getWriter().println($S)
              # Via a local writer — but ONLY one obtained from the HTTP response.
              # Requiring the getWriter() origin is what makes this XSS and not
              # "wrote user data somewhere": it excludes a PrintWriter over a FILE
              # (WebGoat Ping.java logs to new PrintWriter(logFile) — on disk, not a
              # browser — a T3 FP) and System.out/err (the eladmin AliPayController
              # FP, P2), neither of which is an HTTP response.
              - patterns:
                  - pattern-either:
                      - pattern: $OUT.write($S)
                      - pattern: $OUT.print($S)
                      - pattern: $OUT.println($S)
                  - pattern-inside: |
                      $W $OUT = $RESP.getWriter();
                      ...
          - focus-metavariable: $S

  # ── OS command injection ─────────────────────────────────────────────────────
  - id: aegis-java-command-injection
    mode: taint
    languages: [java]
    severity: ERROR
    message: >-
      Untrusted request data flows into an OS command. Runtime.exec(String) and
      single-argument ProcessBuilder pass the whole command through the OS,
      allowing injection. Pass a fixed program plus a separate argument array
      (new ProcessBuilder("prog", arg1, arg2)) and validate the program name.
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [java]
      references:
        - https://owasp.org/www-community/attacks/Command_Injection
    pattern-sources: *request_sources
    pattern-sanitizers:
      - pattern-either:
          # ESAPI OS codec + strict allow-list validation before shelling out.
          - pattern: ESAPI.encoder().encodeForOS(...)
          - pattern: org.owasp.esapi.ESAPI.encoder().encodeForOS(...)
          - pattern: ESAPI.validator().getValidInput(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Runtime.getRuntime().exec($CMD)
              - pattern: new ProcessBuilder($CMD)
          - focus-metavariable: $CMD

  # ── Server-side request forgery ──────────────────────────────────────────────
  - id: aegis-java-ssrf
    mode: taint
    languages: [java]
    severity: ERROR
    message: >-
      Untrusted request data is used to build the target of a server-side HTTP
      request (SSRF). Validate the URL against a strict host allowlist before use.
    metadata:
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp:
        - "A10:2021 - Server-Side Request Forgery (SSRF)"
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [java]
      references:
        - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
    pattern-sources: *request_sources
    pattern-sanitizers:
      - pattern-either:
          - pattern: validateUrl(...)
          - pattern: isAllowedUrl(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              # new URL(u) is built to be FETCHED (WebGoat JKU: new URL(jku) that a
              # JwkProvider then loads). URI.create(u) is NOT a fetch — it only parses
              # a string, and is used for redirect Location headers (booklore
              # OidcAuthController setLocation(URI.create(redirectUrl))) and URL
              # parsing. Matching it flagged open-redirects and even fixed-host
              # proxies as SSRF — T3 FPs — so it is deliberately excluded. KNOWN GAP:
              # a fetch via a pre-parsed URI (RestTemplate/WebClient/HttpClient) is
              # not modelled; adding those sinks needs its own 0-FP pass.
              - pattern: new java.net.URL($U)
              - pattern: new URL($U)
              - pattern: new HttpGet($U)
              - pattern: new HttpPost($U)
          - focus-metavariable: $U

  # ── Path traversal ───────────────────────────────────────────────────────────
  - id: aegis-java-path-traversal
    mode: taint
    languages: [java]
    severity: ERROR
    message: >-
      Untrusted request data flows into a filesystem path, enabling path
      traversal. Reduce to a bare filename with FilenameUtils.getName(), resolve
      it under a fixed base directory, and verify the canonical path stays within.
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [java]
      references:
        - https://owasp.org/www-community/attacks/Path_Traversal
    pattern-sources: *request_sources
    pattern-sanitizers:
      - pattern-either:
          - pattern: org.apache.commons.io.FilenameUtils.getName(...)
          - pattern: FilenameUtils.getName(...)
          - pattern: ESAPI.validator().getValidFileName(...)
          - pattern: $F.getCanonicalPath()
          - pattern: $P.normalize()
          # Spring's own path cleaner, and a filename verifier that strips "..".
          # eladmin's FileUtil.verifyFilename() removes `\/:*?"<>|`, leading/trailing
          # dots and every `..` run before the path reaches new File(...) — a real
          # defense; flagging it was a T3 FP.
          - pattern: org.springframework.util.StringUtils.cleanPath(...)
          - pattern: StringUtils.cleanPath(...)
          - pattern: verifyFilename(...)
          - pattern: $X.verifyFilename(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new java.io.File($P)
              - pattern: new File($P)
              # WebGoat's ProfileUploadRetrieval builds new File(baseDir, id + ".jpg")
              # — the 2-arg constructor. The 1-arg form missed it. Focus stays on the
              # child ($P); a tainted base dir with a literal child is not traversal.
              - pattern: new java.io.File($D, $P)
              - pattern: new File($D, $P)
              - pattern: new FileInputStream($P)
              - pattern: new FileReader($P)
              - pattern: new FileOutputStream($P)
              - pattern: new FileWriter($P)
              - pattern: Paths.get($P, ...)
              - pattern: java.nio.file.Paths.get($P, ...)
          - focus-metavariable: $P

  # ── NoSQL injection (MongoDB) ────────────────────────────────────────────────
  - id: aegis-java-nosql-injection
    mode: taint
    languages: [java]
    severity: WARNING
    message: >-
      User-controlled data is parsed directly into a MongoDB query document. An
      attacker can inject query operators ($where, $ne) to bypass logic. Build
      queries with typed filters (Filters.eq) and coerce values to the expected
      type instead of parsing raw request bodies into query documents.
    metadata:
      cwe:
        - "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [java, mongodb]
      references:
        - https://owasp.org/www-community/Injection_Flaws
    pattern-sources: *request_sources
    pattern-sanitizers:
      - pattern-either:
          - pattern: new ObjectId(...)
          - pattern: String.valueOf(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $COLL.find($Q)
              - pattern: $COLL.find($Q, ...)
              - pattern: $COLL.deleteOne($Q)
              - pattern: $COLL.deleteMany($Q)
              - pattern: $COLL.updateOne($Q, ...)
          - focus-metavariable: $Q
          # $Q must be a Mongo query DOCUMENT, not a JPA/service/enum find(id). $COLL
          # cannot be type-resolved (no classpath — customer code is never built), so
          # a bare $COLL.find($Q) also matches Spring-Data, service, and enum methods
          # named find: eladmin's genConfigService.find(tableName) and
          # CodeBiEnum.find(codeBi) are NOT MongoDB — the broad-method FP, same class
          # as the gin $C.Query bug. Require the query to be built as a Mongo document.
          - metavariable-pattern:
              metavariable: $Q
              patterns:
                - pattern-either:
                    - pattern: Document.parse(...)
                    - pattern: org.bson.Document.parse(...)
                    - pattern: new Document(...)
                    - pattern: new org.bson.Document(...)
                    - pattern: BasicDBObject.parse(...)
                    - pattern: new BasicDBObject(...)
                    - pattern: com.mongodb.util.JSON.parse(...)

  # ── LDAP injection ───────────────────────────────────────────────────────────
  - id: aegis-java-ldap-injection
    mode: taint
    languages: [java]
    severity: ERROR
    message: >-
      Untrusted request data is used to build a JNDI/LDAP search filter, enabling
      LDAP injection. Escape filter values with an LDAP encoder
      (e.g. OWASP Encode.forLdap()) before interpolating them.
    metadata:
      cwe:
        - "CWE-90: Improper Neutralization of Special Elements used in an LDAP Query ('LDAP Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [java, ldap]
      references:
        - https://owasp.org/www-community/attacks/LDAP_Injection
    pattern-sources: *request_sources
    pattern-sanitizers:
      - pattern-either:
          - pattern: Encode.forLdap(...)
          - pattern: encodeForLDAP(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CTX.search($NAME, $FILTER, $CONTROLS)
          - focus-metavariable: $FILTER
