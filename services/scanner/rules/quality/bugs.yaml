# Aegis reliability-bug rules (quality pillar, issue_type=bug).
#
# These power the SonarQube-style Reliability rating. A "bug" is the highest-
# trust-cost claim we make — "your code is wrong", not "this is a smell" — so
# every rule here runs on Semgrep's real grammar (never regex/line heuristics)
# and is gated to ZERO false positives on our validated repos before shipping.
#
# SEVERITY CAP (see PER_ENGINE_ACCURACY.md): no rule here emits ERROR, so the
# worst our normalizer produces is `medium` (WARNING) — never high/critical.
# One reliability bug therefore caps a repo's Reliability rating at C, never
# D/E, on day one. `high` is reserved for a future, separately-proven pack of
# genuine crash / data-loss rules.
#
# Routing: metadata.pillar=quality sends these to the QUALITY pillar (not
# security) in semgrep_engine._parse; metadata.issue_type=bug is loaded into
# enrichment.enricher._QUALITY_BUG_RULES at import so _classify_issue_type tags
# them issue_type=bug. bugs.yaml is the single source of truth for both.
#
# DROPPED (failed the 0-FP gate, documented in PER_ENGINE_ACCURACY.md):
#   - aegis-bug-self-assignment (`$X = $X`): 48 FP / 0 TP across the 5 validated
#     repos. `readonly EntityType = EntityType;` is the Angular template-exposure
#     idiom (LHS is a new class field, RHS the imported enum — not a self-assign),
#     `$s = (string)$s;` is a PHP defensive cast, `a = b = c` is a JS chained
#     assignment. All are textually `X = X` yet none are bugs, and the Angular
#     idiom is syntactically indistinguishable from a real self-assignment.
#   - empty-catch: SonarQube classifies it as a code *smell* (S108), not a bug,
#     and intentional `catch {/* ignore */}` blocks make it FP-prone.
#
# DEDUP — superseded by Ruff (Q3), which has a real Python semantic engine where
# ours was only a pattern. When two engines detect the same defect we report it
# ONCE. Removed the Semgrep versions; the SAME aegis_rule_ids are now produced by
# Ruff (mapped in rules/quality/ruff_map.yaml), so lifecycle/enrichment/dedup are
# unaffected:
#   - aegis-bug-mutable-default-arg  -> Ruff B006 (mutable-argument-default)
#   - aegis-bug-py-is-literal-comparison -> Ruff F632 (is-literal)
# No other overlap: our remaining 11 Semgrep rules cover langs/patterns Ruff does
# not (Ruff is Python-only), and our Python `assert-on-tuple` uses a different
# ruff code (F631) that we did not allowlist, so there is no double report.
#   - js-assignment-in-condition (`if ($X = $Y)`): 17 FP / 0 TP — all jQuery's
#     idiomatic `if ((elem = getX()))` truthiness assignments (ESLint no-cond-
#     assign explicitly ALLOWS the double-paren form). Semgrep strips redundant
#     parens, so `if ((x=y))` (intentional) is indistinguishable from `if (x=y)`
#     (typo). Can't tighten → dropped.
#   - js-async-foreach (async callback to `.forEach`): semgrep's `async (...) =>`
#     pattern leaks onto non-async arrows (FP on a plain `forEach((x)=>{...})`),
#     and the metavariable-pattern form fails to parse. No 0-FP formulation found.
#   - java-discarded-string-result (`s.trim();` as a statement, Sonar S2201):
#     semgrep matched the call as a SUB-expression too — FP on `s = s.trim();` and
#     `f(s.trim())` where the result IS used. Can't anchor to expression-statement
#     only in semgrep OSS.
#   - go-copied-mutex (sync.Mutex/WaitGroup copied by value): needs type/field
#     resolution to know a struct contains a lock — not available in semgrep OSS.
#     (`go vet` catches it.) High-severity candidate once expressible.
#   - go-defer-in-loop: intentional in short loops; FP-prone without flow scope.
#   - go-loopvar-capture-in-goroutine: DELIBERATELY omitted — Go 1.22 changed
#     loopvar semantics, so the same code is a bug pre-1.22 and correct after.
#     Deciding requires parsing the `go` directive in go.mod (engine plumbing).
#   - js-duplicate-object-keys / js-duplicate-case-labels: require cross-`...`
#     key equality, which semgrep OSS cannot assert.
#   - js-indexOf-gt-zero: `.indexOf(x) > 0` is legitimately "present after index 0"
#     as often as it is an off-by-one; too FP-prone.
#   - java-thread-run-instead-of-start / java-int-division-to-double: need type
#     resolution (is it a Thread? are both operands int?) — not in semgrep OSS.
#   - py-broad-except-before-narrow: ordering of except clauses is not expressible
#     as a single AST pattern.
#   - unreachable-code-after-return (cross-language): in JS a `function foo(){}`
#     declaration after a return is HOISTED and legal, as are TS type/interface
#     declarations; could not exclude them cleanly, so dropped.
rules:
  # ── Identical if/else branches: the condition can't matter — a copy-paste bug ─
  # Semgrep has no block metavariable, but metavariable REUSE enforces equality,
  # so we enumerate 1..3-statement branches (Sonar S1871). Brace syntax differs by
  # language (js/ts/php parens, go no-parens, python colon-block), so the rule is
  # split into three same-behaviour variants.
  - id: aegis-bug-identical-if-else-branches
    languages: [javascript, typescript, php]
    severity: WARNING
    message: >-
      Both the `if` and the `else` branch run the exact same statement(s), so the
      condition has no effect. One branch was almost certainly meant to differ —
      a classic copy-paste bug that silently produces the wrong behaviour.
    metadata:
      pillar: quality
      issue_type: bug
      category: correctness
      cwe:
        - "CWE-691: Insufficient Control Flow Management"
      references:
        - https://rules.sonarsource.com/java/RSPEC-1871/
    patterns:
      - pattern-either:
          - pattern: if ($C) { $S1 } else { $S1 }
          - pattern: if ($C) { $S1; $S2 } else { $S1; $S2 }
          - pattern: if ($C) { $S1; $S2; $S3 } else { $S1; $S2; $S3 }

  - id: aegis-bug-identical-if-else-branches-go
    languages: [go]
    severity: WARNING
    message: >-
      Both the `if` and the `else` branch run the exact same statement(s), so the
      condition has no effect (copy-paste bug).
    metadata:
      pillar: quality
      issue_type: bug
      category: correctness
      cwe:
        - "CWE-691: Insufficient Control Flow Management"
      references:
        - https://rules.sonarsource.com/java/RSPEC-1871/
    patterns:
      - pattern-either:
          - pattern: if $C { $S1 } else { $S1 }
          - pattern: if $C { $S1; $S2 } else { $S1; $S2 }
          - pattern: if $C { $S1; $S2; $S3 } else { $S1; $S2; $S3 }

  - id: aegis-bug-identical-if-else-branches-py
    languages: [python]
    severity: WARNING
    message: >-
      Both the `if` and the `else` branch run the exact same statement(s), so the
      condition has no effect (copy-paste bug).
    metadata:
      pillar: quality
      issue_type: bug
      category: correctness
      cwe:
        - "CWE-691: Insufficient Control Flow Management"
      references:
        - https://rules.sonarsource.com/java/RSPEC-1871/
    patterns:
      - pattern-either:
          - pattern: |
              if $C:
                  $S1
              else:
                  $S1
          - pattern: |
              if $C:
                  $S1
                  $S2
              else:
                  $S1
                  $S2
          - pattern: |
              if $C:
                  $S1
                  $S2
                  $S3
              else:
                  $S1
                  $S2
                  $S3

  # ── return in finally: silently discards any exception in the try block ──────
  # The return must be a DIRECT statement of the finally block. semgrep's `...`
  # deep-matches into nested callbacks, so a `return` inside an arrow/function/
  # lambda passed to a call in finally is NOT a return-in-finally — we anchor with
  # pattern-inside finally and exclude nested functions (split js/ts vs java
  # because the nested-function syntax differs).
  - id: aegis-bug-return-in-finally
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A `return` inside a `finally` block discards any exception thrown in the
      `try`/`catch` — the error is swallowed and never propagates. Move the
      return out of `finally`; use it only for cleanup.
    metadata:
      pillar: quality
      issue_type: bug
      category: correctness
      cwe:
        - "CWE-584: Return Inside Finally Block"
      references:
        - https://rules.sonarsource.com/java/RSPEC-1143/
    patterns:
      - pattern: return ...;
      - pattern-inside: "finally { ... }"
      - pattern-not-inside: "(...) => { ... }"
      - pattern-not-inside: "function (...) { ... }"

  - id: aegis-bug-return-in-finally-java
    languages: [java]
    severity: WARNING
    message: >-
      A `return` inside a `finally` block discards any exception thrown in the
      `try`/`catch` — the error is swallowed and never propagates. Move the
      return out of `finally`; use it only for cleanup.
    metadata:
      pillar: quality
      issue_type: bug
      category: correctness
      cwe:
        - "CWE-584: Return Inside Finally Block"
      references:
        - https://rules.sonarsource.com/java/RSPEC-1143/
    patterns:
      - pattern: return ...;
      - pattern-inside: "finally { ... }"
      - pattern-not-inside: "(...) -> { ... }"

  # aegis-bug-mutable-default-arg is now owned by Ruff B006 (see DEDUP note in the
  # header) — the Semgrep pattern version was removed in Q3.

  # ── Java: reference equality against a String literal (should be .equals) ────
  - id: aegis-bug-java-string-literal-equality
    languages: [java]
    severity: WARNING
    message: >-
      `==` / `!=` against a String literal compares object references, not
      contents, so it is true only by interning accident and usually wrong. Use
      `.equals()` (or `"literal".equals(x)` to be null-safe).
    metadata:
      pillar: quality
      issue_type: bug
      category: correctness
      cwe:
        - "CWE-597: Use of Wrong Operator in String Comparison"
      references:
        - https://rules.sonarsource.com/java/RSPEC-4973/
    patterns:
      - pattern-either:
          - pattern: $X == "..."
          - pattern: "\"...\" == $X"
          - pattern: $X != "..."
          - pattern: "\"...\" != $X"

  # ═══ Q2 Parts B–D: new bug rules (validated 0-FP on 9 repos: the 5 Q1 repos +
  # this repo's Go/Python + gin + cobra + requests) ═══════════════════════════

  # ── Go: deref of a value before its error is checked → guaranteed nil panic ──
  # HIGH-severity candidate (guaranteed panic) for the future severity ladder.
  - id: aegis-bug-go-nil-deref-before-err-check
    languages: [go]
    severity: WARNING
    message: >-
      This defers a method call on a value that is used BEFORE its error is
      checked. When the call returns an error the value is typically nil, so the
      deferred call dereferences nil and panics. Check `err != nil` and return
      before deferring on the result.
    metadata:
      pillar: quality
      issue_type: bug
      category: correctness
      cwe:
        - "CWE-476: NULL Pointer Dereference"
      references:
        - https://staticcheck.dev/docs/checks#SA5001
    patterns:
      - pattern-either:
          - pattern: |
              $R, $ERR := $CALL(...)
              defer $R.$M(...)
          - pattern: |
              $R, $ERR := $CALL(...)
              defer $R.$F.$M(...)
      - metavariable-regex: {metavariable: $ERR, regex: '^(err|e)$'}

  # ── Go: WaitGroup.Add() inside the goroutine it counts → races with Wait() ───
  - id: aegis-bug-go-waitgroup-add-in-goroutine
    languages: [go]
    severity: WARNING
    message: >-
      `WaitGroup.Add()` is called inside the goroutine it is meant to count. Add()
      must run before the goroutine starts; calling it inside races with Wait(),
      which may return before the goroutine is counted. Call Add() before `go`.
    metadata:
      pillar: quality
      issue_type: bug
      category: concurrency
      cwe:
        - "CWE-362: Concurrent Execution using Shared Resource with Improper Synchronization"
      references:
        - https://pkg.go.dev/sync#WaitGroup.Add
    patterns:
      - pattern: |
          go func() {
            ...
            $WG.Add(...)
            ...
          }()

  # ── JS/TS: `.length < 0` is always false — the guard never triggers ──────────
  - id: aegis-bug-js-length-lt-zero
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      `.length` is never negative, so `.length < 0` is always false and this
      branch is dead. You almost certainly meant `=== 0` (empty) or `> 0`
      (non-empty).
    metadata:
      pillar: quality
      issue_type: bug
      category: correctness
      cwe:
        - "CWE-570: Expression is Always False"
    patterns:
      - pattern: $X.length < 0

  # ── JS/TS: typeof compared to a value that typeof never returns → always false ─
  - id: aegis-bug-js-typeof-invalid-comparison
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      `typeof` never returns this string (valid results are undefined/object/
      boolean/number/string/function/symbol/bigint), so the comparison is always
      false. E.g. arrays are `"object"`, not `"array"`; check `Array.isArray(x)`.
    metadata:
      pillar: quality
      issue_type: bug
      category: correctness
      cwe:
        - "CWE-570: Expression is Always False"
      references:
        - https://rules.sonarsource.com/javascript/RSPEC-3403/
    patterns:
      - pattern-either:
          - pattern: typeof $X === "array"
          - pattern: typeof $X == "array"
          - pattern: typeof $X === "null"
          - pattern: typeof $X == "null"
          - pattern: typeof $X === "String"
          - pattern: typeof $X === "Number"
          - pattern: typeof $X === "Boolean"
          - pattern: typeof $X === "integer"
          - pattern: typeof $X === "float"
          - pattern: typeof $X === "undefinded"
          - pattern: typeof $X === "funtion"

  # aegis-bug-py-is-literal-comparison is now owned by Ruff F632 (see DEDUP note in
  # the header) — the Semgrep pattern version was removed in Q3.

  # ── Python: assert on a tuple literal → non-empty tuple is always truthy ──────
  - id: aegis-bug-py-assert-on-tuple
    languages: [python]
    severity: WARNING
    message: >-
      `assert (cond, "msg")` asserts a 2-tuple, which is always truthy, so the
      assertion never fires. Drop the parentheses: `assert cond, "msg"`.
    metadata:
      pillar: quality
      issue_type: bug
      category: correctness
      cwe:
        - "CWE-670: Always-Incorrect Control Flow Implementation"
      references:
        - https://rules.sonarsource.com/python/RSPEC-5905/
    patterns:
      - pattern: assert ($A, $B)
