# ══ CI/CD supply-chain pack (H2) ═══════════════════════════════════════════════
# Language-independent: these fire on the pipeline definition, not on application
# code, so they are the only rules we ship that yield on a repo in ANY language.
#
# Scope was set by measurement, not by intuition (docs/RULE_TRIAGE_G3.md, H2):
#
#   * Trivy already covers Dockerfile, Terraform and Kubernetes misconfiguration.
#     Measured on juice-shop: 7 dockerfile + 82 terraform results, and exactly
#     0 results targeting .github/workflows. GitHub Actions is the real gap, so
#     that is all this pack touches. Duplicating Trivy would be worse than a miss.
#   * docker-compose is covered by our own rules/iac/docker_compose.yaml.
#
# Every rule here was triaged to zero false positives across 99 workflow files in
# 11 repositories (chatwoot, jellyfin, mastodon, juice-shop, redash, DVWA,
# NodeGoat, WebGoat, spring-petclinic, flask, requests) plus this repository.
rules:
  # ── Script injection: untrusted text expanded into a shell ────────────────────
  # GitHub expands ${{ }} into the run: script BEFORE the shell sees it, so an
  # untrusted value is not an argument — it becomes script text. Deliberately
  # scoped to the fields any GitHub user can set to arbitrary free text. Fields
  # that are structurally constrained (pull_request.number is an integer,
  # head.sha is hex, comments_url is server-generated) are NOT injectable and are
  # excluded: the five such fields present in our corpus (11 uses in all) were
  # false positives in the registry rule this replaces.
  - id: aegis-cicd-workflow-script-injection
    languages: [yaml]
    severity: ERROR
    message: >-
      Untrusted text from the triggering event is expanded directly into this
      run: script. GitHub substitutes ${{ }} into the script body before the
      shell parses it, so a pull request title or branch name containing $(...)
      or a backtick executes as a command on the runner with the workflow's
      token. Bind the value to an environment variable instead --
      env: { TITLE: ${{ github.event.pull_request.title }} } and then use
      "$TITLE" in the script -- so it stays data rather than becoming syntax.
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [github-actions, ci]
      references:
        - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
    paths:
      include:
        - "**/.github/workflows/*.yml"
        - "**/.github/workflows/*.yaml"
        - "**/.github/actions/**/*.yml"
        - "**/.github/actions/**/*.yaml"
    patterns:
      - pattern: |
          run: $CMD
      - metavariable-regex:
          metavariable: $CMD
          regex: (?s).*\$\{\{[^}]*(github\.head_ref|github\.event\.(issue|pull_request|discussion)\.(title|body)|github\.event\.(comment|review|review_comment)\.body|github\.event\.pull_request\.head\.(ref|label)|github\.event\.head_commit\.(message|author\.(name|email))|github\.event\.commits\[[^]]*\]\.(message|author\.(name|email))|github\.event\.pages\[[^]]*\]\.page_name|github\.event\.workflow_run\.(head_branch|head_commit\.message))[^}]*\}\}.*

  # ── Remote script piped straight into a shell ─────────────────────────────────
  - id: aegis-cicd-curl-pipe-shell
    languages: [yaml]
    severity: ERROR
    message: >-
      This step downloads a script over the network and executes it immediately,
      with no pinned version and no integrity check. Whoever controls that URL --
      or anyone who can intercept or poison it -- executes arbitrary code on the
      runner, with access to the job's secrets and its write token. Download to a
      file, verify a known checksum or signature, then run it; or install the
      tool from a version-pinned package or a SHA-pinned action.
    metadata:
      cwe:
        - "CWE-494: Download of Code Without Integrity Check"
      owasp:
        - "A08:2021 - Software and Data Integrity Failures"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [github-actions, ci, supply-chain]
      references:
        - https://owasp.org/www-project-top-10-ci-cd-security-risks/
    paths:
      include:
        - "**/.github/workflows/*.yml"
        - "**/.github/workflows/*.yaml"
        - "**/.github/actions/**/*.yml"
        - "**/.github/actions/**/*.yaml"
    patterns:
      - pattern: |
          run: $CMD
      - metavariable-regex:
          metavariable: $CMD
          regex: (?s).*(curl|wget)[^|\n]*\|\s*(sudo\s+)?(env\s+[^|\n]*)?(ba|z|k|da)?sh\b.*

  # ── Third-party action on a movable ref ───────────────────────────────────────
  # A tag is a pointer, not a version: the owner (or anyone who compromises the
  # account) can repoint v1 at new code, which then runs inside our job. This is
  # not hypothetical — CVE-2025-30066 (tj-actions/changed-files) was exactly a
  # retagged third-party action, and it exfiltrated secrets from every repo that
  # trusted the tag.
  #
  # Scoping decision, stated plainly: we exclude actions/, github/ and docker/ —
  # the first-party publishers. Their tags are movable too, so the stricter
  # posture is to pin everything; we exclude them because a compromise there is a
  # compromise of the runner platform itself, and because in our corpus they are
  # 121 of the 154 movable refs — reporting them would bury the 33 that a reader
  # can actually act on. Pin those 121 as well if your threat model warrants it.
  - id: aegis-cicd-action-unpinned-ref
    languages: [yaml]
    severity: WARNING
    message: >-
      This third-party action is referenced by a tag or branch, which the action's
      owner can move at any time. Whatever that ref points to at the moment the
      job runs executes with the job's secrets and token, so the code you reviewed
      is not necessarily the code you get. Pin the action to a full 40-character
      commit SHA and keep the readable version in a trailing comment --
      uses: owner/action@e5d6f7a... # v4.1.2 -- so upgrades stay deliberate.
    metadata:
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      owasp:
        - "A08:2021 - Software and Data Integrity Failures"
      category: security
      subcategory: [audit]
      confidence: HIGH
      likelihood: LOW
      impact: HIGH
      technology: [github-actions, ci, supply-chain]
      references:
        - https://nvd.nist.gov/vuln/detail/CVE-2025-30066
        - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
    paths:
      include:
        - "**/.github/workflows/*.yml"
        - "**/.github/workflows/*.yaml"
        - "**/.github/actions/**/*.yml"
        - "**/.github/actions/**/*.yaml"
    patterns:
      - pattern: |
          uses: $REF
      # owner/repo[/subpath]@ref — excludes ./local-action and docker:// forms,
      # which are not third-party registry references at all.
      - metavariable-regex:
          metavariable: $REF
          regex: ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9_.-]+(/[A-Za-z0-9_./-]+)*@[A-Za-z0-9_./-]+$
      # A full commit SHA is immutable — that is the fix, so it must not fire.
      # Stated as "not a SHA" rather than as a list of tag shapes, so a ref we
      # have never seen is treated as movable by default.
      - pattern-not-regex: uses:\s*\S+@[0-9a-fA-F]{40,64}
      - pattern-not-regex: uses:\s*(actions|github|docker)/
