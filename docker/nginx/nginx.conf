# Aegis reverse proxy.
#   /api/auth/*  → web   (NextAuth lives on the Next.js app)
#   /api/*       → api   (Go API gateway)
#   /*           → web   (Next.js dashboard)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # JSON-ish access log to stdout for container log aggregation.
    log_format main '$remote_addr - $status "$request" '
                    'upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # Allow reasonably large bodies (webhook payloads, future uploads).
    client_max_body_size 10m;

    upstream api_backend {
        server api:8080;
    }
    upstream web_backend {
        server web:3000;
    }

    # Shared proxy headers so downstream services see the real client IP/proto.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    server {
        listen 80;
        server_name _;

        # Convenience health endpoint mapping to the API's root /health.
        location = /api/health {
            proxy_pass http://api_backend/health;
        }

        # NextAuth endpoints belong to the Next.js app — matched before /api/.
        location /api/auth/ {
            proxy_pass http://web_backend;
        }

        # Everything else under /api/ goes to the Go API.
        location /api/ {
            proxy_pass http://api_backend;
            # Long-running scan triggers / reports.
            proxy_read_timeout 120s;
        }

        # WebSocket-friendly defaults for the Next.js app (HMR in dev, etc.).
        location / {
            proxy_pass http://web_backend;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 90s;
        }
    }
}
